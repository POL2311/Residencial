<div id="residentesView" class="space-y-4">

  <!-- ALERT -->
  <div id="residentesAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <!-- HEADER -->
  <div class="flex items-center justify-between">
    <h1 class="text-lg font-semibold text-slate-800">Residentes</h1>
    <button id="btnAddResidente"
      class="hidden text-xs px-4 py-2 rounded-full bg-[#2E5D73] text-white hover:opacity-95">
      + Agregar residente
    </button>
  </div>

  <!-- EMPTY -->
  <div id="residentesEmpty" class="hidden">
    <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-600">
      No hay residentes registrados.
    </div>
  </div>
<div class="mb-4">
  <input
    id="residentSearch"
    type="text"
    placeholder="Buscar residente, unidad o teléfono..."
    class="w-full max-w-md rounded-xl border px-4 py-2 text-sm"
  />
</div>

<div class="grid grid-cols-4 gap-4 px-3 mb-3 text-xs font-semibold text-slate-500">
  <div>Residente</div>
  <div>Calle / Casa</div>
  <div class="text-center">Estado servicio</div>
  <div class="text-right">Más acciones</div>
</div>


  <!-- LIST -->
  <div id="residentesList" class="space-y-3"></div>

  <!-- MODAL CRUD RESIDENTE -->
  <div id="modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm">
    <div class="min-h-full flex items-end md:items-center justify-center p-0 md:p-4">
      <div class="w-full md:max-w-lg bg-white md:rounded-2xl rounded-t-2xl shadow-2xl overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
          <div id="modalTitle" class="text-sm font-semibold text-slate-800">—</div>
          <button id="btnCloseModal"
            class="h-9 w-9 rounded-full bg-slate-100 hover:bg-slate-200">✕</button>
        </div>
        <form id="modalForm" class="p-4 space-y-3">
          <input type="hidden" name="action">
          <input type="hidden" name="residente_id">
          <div>
            <label class="block text-xs text-slate-600 mb-1">Nombre *</label>
            <input name="nombre" required class="w-full rounded-xl border px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs text-slate-600 mb-1">Teléfono</label>
            <input name="telefono" class="w-full rounded-xl border px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs text-slate-600 mb-1">Email</label>
            <input name="email" type="email" class="w-full rounded-xl border px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs text-slate-600 mb-1">Unidad</label>
            <select name="unidad_id" class="w-full rounded-xl border px-3 py-2 text-sm"></select>
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" id="btnCancelModal"
              class="text-sm px-4 py-2 rounded-xl border">Cancelar</button>
            <button type="submit"
              class="text-sm px-4 py-2 rounded-xl bg-[#2E5D73] text-white">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="detailModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm">
    <div class="min-h-full flex items-center justify-center p-4">
      <div id="detailModalContent"
        class="w-full max-w-2xl bg-white rounded-2xl shadow-2xl overflow-y-auto max-h-[90vh] p-4">
      </div>
    </div>
  </div>

</div>

<script src="/admin_residencial/js/residentes.js"></script>

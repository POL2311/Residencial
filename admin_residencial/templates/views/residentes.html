<div id="residentesView" class="space-y-4">

  <!-- ALERT -->
  <div id="residentesAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <!-- HEADER -->
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <div class="text-[11px] uppercase tracking-[0.18em] text-slate-400">Gestión residencial</div>
      <h1 class="mt-1 text-2xl font-semibold text-slate-800">Residentes</h1>
    </div>
    <button id="btnAddResidente"
      class="hidden text-xs px-4 py-2 rounded-full bg-[#2E5D73] text-white hover:opacity-95">
      + Agregar residente
    </button>
  </div>

  <!-- EMPTY -->
  <div id="residentesEmpty" class="hidden">
    <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-600">
      No hay residentes registrados.
    </div>
  </div>

  <!-- SEARCH -->
  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <input
      id="residentSearch"
      type="text"
      placeholder="Buscar residente, unidad o teléfono..."
      class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm"
    />
  </div>

  <!-- HEADERS -->
  <div class="hidden md:grid grid-cols-4 gap-4 rounded-2xl border border-slate-200 bg-white/70 px-5 py-3 text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-500 shadow-sm">
    <div>Residente</div>
    <div>Unidad</div>
    <div class="text-center">Servicio</div>
    <div class="text-right">Acciones</div>
  </div>

  <!-- LIST -->
  <div id="residentesList" class="space-y-3"></div>

  <!-- MODAL CRUD RESIDENTE -->
  <div id="modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm">
    <div class="min-h-full flex items-end md:items-center justify-center p-0 md:p-4">
      <div class="flex max-h-[92vh] w-full md:max-w-2xl flex-col bg-white md:rounded-2xl rounded-t-2xl shadow-2xl overflow-hidden">

        <!-- Header -->
        <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
          <div>
            <div id="modalTitle" class="text-base font-semibold text-slate-800">—</div>
            <p class="text-xs text-slate-500">Completa la información del residente</p>
          </div>
          <button id="btnCloseModal"
            class="h-9 w-9 rounded-full bg-slate-100 hover:bg-slate-200">
            ✕
          </button>
        </div>

        <!-- Form -->
        <form id="modalForm" class="flex min-h-0 flex-1 flex-col">
          <div class="flex-1 overflow-y-auto p-5 space-y-5">
          <input type="hidden" name="action">
          <input type="hidden" name="residente_id">

          <!-- Nombre -->
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Nombre *</label>
            <input
              name="nombre"
              required
              class="w-full rounded-xl border px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#2E5D73]/20"
              placeholder="Ej. Juan Pérez Gómez">
          </div>

          <!-- Teléfono + Email -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Teléfono</label>
              <input
                name="telefono"
                class="w-full rounded-xl border px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#2E5D73]/20"
                placeholder="Ej. 5512345678">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Email</label>
              <input
                name="email"
                type="email"
                class="w-full rounded-xl border px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#2E5D73]/20"
                placeholder="Ej. correo@dominio.com">
            </div>
          </div>

          <!-- Passwords -->
          <div class="rounded-2xl border border-slate-200 bg-slate-50/70 p-4 space-y-4">
            <div>
              <h3 class="text-sm font-semibold text-slate-700">Seguridad</h3>
              <p class="text-xs text-slate-500 mt-1">
                Puedes dejar estos campos vacíos si no deseas cambiar la contraseña.
              </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Nueva contraseña</label>
                <input
                  name="password"
                  type="password"
                  minlength="8"
                  class="w-full rounded-xl border bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#2E5D73]/20"
                  placeholder="Mínimo 8 caracteres">
                <p class="mt-1 text-[11px] text-slate-500">
                  En alta, si lo dejas vacío, se generará una contraseña temporal.
                </p>
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Confirmar contraseña</label>
                <input
                  name="password_confirm"
                  type="password"
                  minlength="8"
                  class="w-full rounded-xl border bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#2E5D73]/20"
                  placeholder="Repite la contraseña">
              </div>
            </div>
          </div>

          <!-- Unidad -->
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Unidad</label>
            <select
              name="unidad_id"
              class="w-full rounded-xl border px-4 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#2E5D73]/20">
            </select>
          </div>

          <!-- Actions -->
          </div>
          <div class="border-t border-slate-100 bg-white px-5 py-4 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
            <button
              type="button"
              id="btnCancelModal"
              class="text-sm px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100">
              Cancelar
            </button>
            <button
              type="submit"
              class="text-sm px-5 py-2.5 rounded-xl bg-[#2E5D73] text-white hover:opacity-95">
              Guardar
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <!-- DETAIL MODAL -->
  <div id="detailModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm">
    <div class="min-h-full flex items-center justify-center p-4">
      <div id="detailModalContent"
        class="w-full max-w-2xl bg-white rounded-2xl shadow-2xl overflow-y-auto max-h-[90vh] p-4">
      </div>
    </div>
  </div>

</div>

<script src="/admin_residencial/js/residentes.js"></script>

<div id="areasOperativasView" class="space-y-5">
  <div id="areasOperativasAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <section class="rounded-[1.75rem] border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
      <div>
        <div class="app-admin-kicker">Mapa operativo</div>
        <h1 class="app-admin-title" data-os-label="units">Áreas</h1>
        <p class="app-admin-subtitle">Organiza zonas, departamentos operativos y puntos de control usados por personal, pases, materiales e incidentes.</p>
      </div>
      <button id="btnNuevaAreaOperativa" type="button" class="app-admin-primary rounded-full px-5 py-2.5 text-sm font-semibold">
        + Nueva área
      </button>
    </div>
  </section>

  <section class="rounded-[1.75rem] border border-slate-200 bg-white p-4 shadow-sm">
    <div class="grid gap-3 md:grid-cols-[minmax(0,1fr)_180px]">
      <input id="areaOperativaSearch" type="text" placeholder="Buscar área, código, zona o descripción..." class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm" />
      <button id="btnRefreshAreasOperativas" type="button" class="app-admin-ghost rounded-xl px-4 py-2.5 text-sm font-medium">
        Actualizar
      </button>
    </div>
  </section>

  <section id="areasOperativasEmpty" class="hidden rounded-[1.75rem] border border-dashed border-slate-200 bg-white p-6 text-sm text-slate-500">
    No hay áreas operativas registradas todavía.
  </section>

  <section id="areasOperativasList" class="grid gap-3 md:grid-cols-2"></section>

  <div id="areaOperativaModal" class="fixed inset-0 z-50 hidden items-end justify-center bg-black/60 p-0 backdrop-blur-sm md:items-center md:p-4">
    <div class="app-admin-modal-card w-full max-w-xl rounded-t-2xl bg-white shadow-2xl md:rounded-2xl">
      <div class="app-admin-modal-header flex items-center justify-between border-b bg-slate-50 px-4 py-3">
        <h2 id="areaOperativaModalTitle" class="text-base font-semibold text-slate-800">Nueva área</h2>
        <button id="btnCloseAreaOperativaModal" type="button" class="h-9 w-9 rounded-full border bg-white hover:bg-slate-100">✕</button>
      </div>

      <form id="areaOperativaForm" class="flex min-h-0 flex-1 flex-col">
        <div class="app-admin-modal-body space-y-3 px-4 py-4">
          <input type="hidden" name="id" />
          <div id="areaOperativaFormError" class="hidden rounded-xl bg-rose-100 px-4 py-3 text-sm text-rose-700"></div>

          <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
            <div class="md:col-span-2">
              <label class="mb-1 block text-xs text-slate-600">Nombre del área *</label>
              <input name="nombre" required maxlength="150" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="Ej. Recibo de proveedores" />
            </div>
            <div>
              <label class="mb-1 block text-xs text-slate-600">Código</label>
              <input name="codigo" maxlength="50" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="Ej. ANDEN-01" />
            </div>
            <div>
              <label class="mb-1 block text-xs text-slate-600">Tipo</label>
              <select name="tipo" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
                <option value="general">General</option>
                <option value="zona">Zona</option>
                <option value="departamento_operativo">Departamento operativo</option>
                <option value="anden">Andén</option>
                <option value="bodega">Bodega</option>
                <option value="punto_control">Punto de control</option>
              </select>
            </div>
          </div>

          <div>
            <label class="mb-1 block text-xs text-slate-600">Descripción</label>
            <textarea name="descripcion" rows="4" maxlength="1200" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="Uso operativo, restricciones o ubicación interna."></textarea>
          </div>

          <label class="flex items-center gap-2 text-sm text-slate-700">
            <input type="checkbox" name="activo" value="1" checked />
            Área activa
          </label>
        </div>

        <div class="app-admin-modal-footer flex flex-col-reverse gap-2 border-t border-slate-100 bg-white px-4 py-3 sm:flex-row sm:justify-end">
          <button id="btnCancelAreaOperativa" type="button" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">
            Cancelar
          </button>
          <button type="submit" class="rounded-xl bg-[#2E5D73] px-4 py-2 text-sm font-semibold text-white hover:opacity-95">
            Guardar área
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

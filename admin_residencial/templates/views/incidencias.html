<div id="incidenciasView" class="space-y-4">
  <div id="incidenciasAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div>
    <div class="text-[11px] uppercase tracking-[0.18em] text-slate-400">Seguimiento operativo</div>
    <h1 class="mt-1 text-2xl font-semibold text-slate-800">Incidencias</h1>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
    <div class="flex items-center gap-3">
      <label class="text-sm">Mostrar:</label>
      <select id="filterEstado" class="rounded-xl border px-3 py-2 text-sm">
        <option value="todas">Todas</option>
        <option value="abierta">Abiertas</option>
        <option value="en_proceso">En proceso</option>
        <option value="cerrada">Cerradas</option>
      </select>
    </div>

    <div class="flex gap-2 w-full md:w-auto">
      <input
        id="searchIncidencias"
        type="text"
        placeholder="Buscar por título, unidad o residente..."
        class="w-full md:w-[340px] rounded-xl border px-4 py-2 text-sm"
      />
      <button id="btnAddIncidencia"
        class="bg-[#2E5D73] text-white text-sm font-semibold px-4 py-2 rounded-xl hover:opacity-95 whitespace-nowrap">
        + Reportar
      </button>
    </div>
  </div>
  </div>

  <div id="incidenciasList" class="space-y-3"></div>

  <!-- Modal Nueva -->
  <div id="incidenciaModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm items-end md:items-center justify-center z-50 hidden p-0 md:p-4">
    <div class="flex max-h-[92vh] w-full max-w-md flex-col overflow-hidden bg-white rounded-t-2xl md:rounded-2xl shadow-2xl">
      <div class="flex justify-between items-center border-b px-4 py-3 bg-slate-50">
        <h2 class="text-base font-semibold">Reportar incidencia</h2>
        <button id="btnCloseIncidenciaModal" class="h-9 w-9 rounded-full bg-white border hover:bg-slate-100 flex items-center justify-center">✕</button>
      </div>

      <form id="incidenciaForm" class="flex min-h-0 flex-1 flex-col">
        <div class="flex-1 overflow-y-auto px-4 py-4 space-y-3">
        <div id="incidenciaAddError" class="hidden rounded-xl bg-rose-100 text-rose-700 px-4 py-3 text-sm"></div>

        <div>
          <label class="block text-xs text-slate-600 mb-1">Unidad</label>
          <select name="unidad_id" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm"></select>
        </div>

        <div>
          <label class="block text-xs text-slate-600 mb-1">Tipo</label>
          <select name="tipo" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
            <option value="seguridad">Seguridad</option>
            <option value="servicio">Servicio</option>
            <option value="vecino">Vecino</option>
            <option value="infraestructura">Infraestructura</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-600 mb-1">Título</label>
          <input type="text" name="titulo" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm" required />
        </div>

        <div>
          <label class="block text-xs text-slate-600 mb-1">Descripción</label>
          <textarea name="descripcion" rows="4" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm" required></textarea>
        </div>

        <div>
          <label class="block text-xs text-slate-600 mb-1">Prioridad</label>
          <select name="prioridad" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
            <option value="baja">Baja</option>
            <option value="media" selected>Media</option>
            <option value="alta">Alta</option>
          </select>
        </div>

        </div>
        <div class="border-t border-slate-100 bg-white px-4 py-3 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
          <button type="button" id="btnCancelIncidenciaAdd"
            class="text-sm px-4 py-2 rounded-xl border hover:bg-slate-50">
            Cancelar
          </button>
          <button type="submit"
            class="bg-emerald-600 text-white text-sm font-semibold px-4 py-2 rounded-xl hover:bg-emerald-700">
            Registrar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Editar -->
  <div id="incidenciaEditModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm items-end md:items-center justify-center z-50 hidden p-0 md:p-4">
    <div class="flex max-h-[92vh] w-full max-w-md flex-col overflow-hidden bg-white rounded-t-2xl md:rounded-2xl shadow-2xl">
      <div class="flex justify-between items-center border-b px-4 py-3 bg-slate-50">
        <h2 class="text-base font-semibold">Actualizar incidencia</h2>
        <button id="btnCloseEditIncModal" class="h-9 w-9 rounded-full bg-white border hover:bg-slate-100 flex items-center justify-center">✕</button>
      </div>

      <form id="incidenciaEditForm" class="flex min-h-0 flex-1 flex-col">
        <div class="flex-1 overflow-y-auto px-4 py-4 space-y-3">
        <div id="incidenciaEditError" class="hidden rounded-xl bg-rose-100 text-rose-700 px-4 py-3 text-sm"></div>

        <input type="hidden" name="id" />

        <div>
          <label class="block text-xs text-slate-600 mb-1">Asignar guardia</label>
          <select name="guardia_id" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
            <option value="">-- Sin asignar --</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-600 mb-1">Estado</label>
          <select name="estado" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
            <option value="abierta">Abierta</option>
            <option value="en_proceso">En proceso</option>
            <option value="cerrada">Cerrada</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-600 mb-1">Prioridad</label>
          <select name="prioridad" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
            <option value="baja">Baja</option>
            <option value="media">Media</option>
            <option value="alta">Alta</option>
          </select>
        </div>

        </div>
        <div class="border-t border-slate-100 bg-white px-4 py-3 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
          <button type="button" id="btnCancelIncidenciaEdit"
            class="text-sm px-4 py-2 rounded-xl border hover:bg-slate-50">
            Cancelar
          </button>
          <button type="submit"
            class="bg-[#2E5D73] text-white text-sm font-semibold px-4 py-2 rounded-xl hover:opacity-95">
            Guardar cambios
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

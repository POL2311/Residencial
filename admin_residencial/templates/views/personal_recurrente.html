<div id="personalRecurrenteView" class="space-y-4">
  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <div>
        <div class="text-[11px] uppercase tracking-[0.18em] text-slate-400">Control operativo</div>
        <h1 class="mt-1 text-2xl font-semibold text-slate-800" data-os-label="people">Personal recurrente</h1>
        <p class="mt-1 text-sm text-slate-500">Administra personal fijo, QR personales y PIN de validación.</p>
      </div>
      <button id="btnPersonalNuevo" type="button" class="rounded-xl bg-[#2E5D73] px-4 py-2 text-sm font-semibold text-white hover:opacity-95">
        + Nuevo personal
      </button>
    </div>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="flex flex-col gap-2 md:flex-row">
      <input id="personalSearch" type="text" placeholder="Buscar por nombre, empresa, teléfono o área..." class="w-full rounded-xl border px-4 py-2 text-sm" />
      <button id="btnPersonalRefresh" type="button" class="rounded-xl border px-4 py-2 text-sm hover:bg-slate-50">Refrescar</button>
    </div>
  </div>

  <div id="personalAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>
  <div id="personalList" class="space-y-3"></div>

  <div id="personalModal" class="fixed inset-0 z-50 hidden items-end justify-center bg-black/60 p-0 md:items-center md:p-4">
    <div class="app-admin-modal-card w-full max-w-2xl rounded-t-2xl bg-white shadow-2xl md:rounded-2xl">
      <div class="app-admin-modal-header flex items-center justify-between border-b px-4 py-3 bg-slate-50">
        <h2 id="personalModalTitle" class="text-base font-semibold">Nuevo personal</h2>
        <button id="btnPersonalClose" type="button" class="h-9 w-9 rounded-full border bg-white hover:bg-slate-100">✕</button>
      </div>
      <form id="personalForm" class="flex min-h-0 flex-1 flex-col" enctype="multipart/form-data">
        <div class="app-admin-modal-body space-y-3 px-4 py-4">
          <input type="hidden" name="id" />
          <div id="personalFormError" class="hidden rounded-xl bg-rose-100 px-4 py-3 text-sm text-rose-700"></div>

          <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
            <div>
              <label class="mb-1 block text-xs text-slate-600">Nombre</label>
              <input name="nombre" type="text" class="w-full rounded-xl border px-3 py-2 text-sm" required />
            </div>
            <div>
              <label class="mb-1 block text-xs text-slate-600">Teléfono</label>
              <input name="telefono" type="text" class="w-full rounded-xl border px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="mb-1 block text-xs text-slate-600">Empresa</label>
              <input name="empresa" type="text" class="w-full rounded-xl border px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="mb-1 block text-xs text-slate-600">Puesto</label>
              <input name="puesto" type="text" class="w-full rounded-xl border px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="mb-1 block text-xs text-slate-600">Área</label>
              <select name="area_id" class="w-full rounded-xl border px-3 py-2 text-sm"></select>
            </div>
            <div>
              <label class="mb-1 block text-xs text-slate-600">PIN</label>
              <input name="pin" type="password" inputmode="numeric" placeholder="4 a 8 dígitos" class="w-full rounded-xl border px-3 py-2 text-sm" />
            </div>
          </div>

          <div class="personal-compliance-fields hidden grid grid-cols-1 gap-3 md:grid-cols-2">
            <div>
              <label class="mb-1 block text-xs text-slate-600" data-os-label="traffic_light">Semáforo</label>
              <select name="estatus_cumplimiento" class="w-full rounded-xl border px-3 py-2 text-sm">
                <option value="autorizado">Autorizado</option>
                <option value="pendiente">Pendiente</option>
                <option value="bloqueado">Bloqueado</option>
                <option value="documento_vencido">Documento vencido</option>
                <option value="fuera_de_horario">Fuera de horario</option>
              </select>
            </div>
            <div>
              <label class="mb-1 block text-xs text-slate-600" data-os-label="block_reason">Motivo de bloqueo</label>
              <input name="motivo_bloqueo" type="text" maxlength="255" class="w-full rounded-xl border px-3 py-2 text-sm" placeholder="Opcional salvo bloqueo" />
            </div>
          </div>

          <div>
            <label class="mb-1 block text-xs text-slate-600">Foto</label>
            <input name="foto" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" class="w-full rounded-xl border px-3 py-2 text-sm" />
          </div>

          <div>
            <label class="mb-1 block text-xs text-slate-600">Notas</label>
            <textarea name="notas" rows="3" class="w-full rounded-xl border px-3 py-2 text-sm"></textarea>
          </div>

          <label class="flex items-center gap-2 text-sm text-slate-700">
            <input type="checkbox" name="activo" value="1" checked />
            Personal activo
          </label>
        </div>
        <div class="app-admin-modal-footer flex flex-col-reverse gap-2 border-t bg-white px-4 py-3 sm:flex-row sm:justify-end">
          <button id="btnPersonalCancel" type="button" class="rounded-xl border px-4 py-2 text-sm hover:bg-slate-50">Cancelar</button>
          <button type="submit" class="rounded-xl bg-[#2E5D73] px-4 py-2 text-sm font-semibold text-white hover:opacity-95">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>

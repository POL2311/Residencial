<div id="personalRecurrenteView" class="space-y-4">
  <div class="rounded-[1.75rem] border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <div>
        <div class="text-[11px] uppercase tracking-[0.18em] text-slate-400">Control operativo</div>
        <h1 class="mt-1 text-2xl font-semibold text-slate-800">Personal recurrente</h1>
        <p class="mt-1 text-sm text-slate-500">Administra personal fijo, QR personales y PIN de validación.</p>
      </div>
      <button id="btnPersonalNuevo" type="button" class="rounded-xl bg-[#2E5D73] px-4 py-2.5 text-sm font-semibold text-white hover:opacity-95">
        + Nuevo personal
      </button>
    </div>
  </div>

  <div class="rounded-[1.75rem] border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex flex-col gap-2 md:flex-row">
      <input id="personalSearch" type="text" placeholder="Buscar por nombre, empresa, teléfono o área..." class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white" />
      <button id="btnPersonalRefresh" type="button" class="min-h-11 rounded-xl border border-slate-200 bg-white px-4 text-sm font-medium text-slate-700 transition hover:bg-slate-50">Refrescar</button>
    </div>
  </div>

  <div id="personalAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>
  <div id="personalList" class="space-y-3"></div>

  <div id="personalModal" class="hidden fixed inset-0 z-[999] bg-black/60 backdrop-blur-sm">
    <div class="flex min-h-dvh w-full items-center justify-center p-4 pointer-events-none">
      <div class="flex max-h-[calc(100dvh-2rem)] w-full max-w-2xl flex-col overflow-hidden rounded-[1.35rem] bg-white shadow-2xl sm:max-h-[min(86dvh,700px)] pointer-events-auto">
        <div class="flex shrink-0 items-start justify-between gap-3 border-b border-slate-100 px-4 py-3">
          <div class="min-w-0">
            <h2 id="personalModalTitle" class="text-base font-semibold leading-tight text-slate-900">Nuevo personal</h2>
            <p class="mt-1 text-xs leading-5 text-slate-500">Registra o edita los datos del personal fijo y su acceso.</p>
          </div>
          <button id="btnPersonalClose" type="button" aria-label="Cerrar formulario"
            class="h-11 w-11 shrink-0 rounded-full bg-slate-100 text-slate-700 transition hover:bg-slate-200 flex items-center justify-center">✕</button>
        </div>
        <form id="personalForm" class="flex min-h-0 flex-1 flex-col" enctype="multipart/form-data">
          <div class="flex-1 space-y-4 overflow-y-auto overscroll-contain px-4 py-4">
            <input type="hidden" name="id" />
            <div id="personalFormError" class="hidden rounded-xl bg-rose-100 px-4 py-3 text-sm text-rose-700"></div>

            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
              <div>
                <label class="mb-1 block text-xs font-medium text-slate-600">Nombre *</label>
                <input name="nombre" type="text" placeholder="Ej. Carlos Ortiz" class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white" required />
              </div>
              <div>
                <label class="mb-1 block text-xs font-medium text-slate-600">Teléfono</label>
                <input name="telefono" type="text" placeholder="Ej. 5512345678" class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white" />
              </div>
              <div>
                <label class="mb-1 block text-xs font-medium text-slate-600">Empresa</label>
                <input name="empresa" type="text" placeholder="Ej. Servicios Generales S.A." class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white" />
              </div>
              <div>
                <label class="mb-1 block text-xs font-medium text-slate-600">Puesto</label>
                <input name="puesto" type="text" placeholder="Ej. Jardinero, Limpieza" class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white" />
              </div>
              <div>
                <label class="mb-1 block text-xs font-medium text-slate-600">Área</label>
                <select name="area_id" class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white"></select>
              </div>
              <div>
                <label class="mb-1 block text-xs font-medium text-slate-600">PIN</label>
                <input name="pin" type="password" inputmode="numeric" placeholder="4 a 8 dígitos" class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white" />
              </div>
            </div>

            <div>
              <label class="mb-1 block text-xs font-medium text-slate-600">Foto</label>
              <div class="relative flex items-center justify-between gap-3 rounded-xl border border-slate-200 bg-white p-2 pl-3">
                <span class="text-sm text-slate-500 truncate" id="fileNamePlaceholder">Ningún archivo seleccionado</span>
                <input name="foto" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" class="absolute inset-0 cursor-pointer opacity-0" onchange="document.getElementById('fileNamePlaceholder').innerText = this.files[0] ? this.files[0].name : 'Ningún archivo seleccionado'" />
                <span class="inline-flex min-h-9 items-center justify-center rounded-lg bg-slate-100 px-3 text-xs font-semibold text-slate-700 transition hover:bg-slate-200 pointer-events-none">Elegir archivo</span>
              </div>
            </div>

            <div>
              <label class="mb-1 block text-xs font-medium text-slate-600">Notas</label>
              <textarea name="notas" rows="3" placeholder="Información adicional..." class="w-full rounded-xl border border-slate-200 px-3 py-2 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white"></textarea>
            </div>

            <label class="flex items-center gap-3 cursor-pointer select-none">
              <input type="checkbox" name="activo" value="1" checked class="h-5 w-5 rounded-lg border-slate-300 text-[#2E5D73] focus:ring-[#2E5D73]/20" />
              <span class="text-sm font-medium text-slate-700">Personal activo</span>
            </label>
          </div>
          <div class="flex shrink-0 items-center gap-2 border-t border-slate-100 bg-white px-4 py-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))]">
            <button id="btnPersonalCancel" type="button" class="min-h-11 rounded-xl border border-slate-200 bg-white px-4 text-sm font-medium text-slate-700 transition hover:bg-slate-50">Cancelar</button>
            <button type="submit" class="min-h-11 flex-1 rounded-xl bg-[#2E5D73] px-4 text-sm font-semibold text-white shadow-sm transition hover:opacity-95">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

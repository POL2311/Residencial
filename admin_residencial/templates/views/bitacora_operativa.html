<div id="bitacoraOperativaView" class="space-y-5">
  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="app-admin-kicker">Reporte operativo</div>
    <h1 class="app-admin-title">Bitácora del día</h1>
    <p class="app-admin-subtitle">Consulta movimientos, resultados y evidencia de caseta con una lectura más compacta y premium.</p>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <form id="bitacoraFilters" class="grid gap-3 md:grid-cols-4">
      <div>
        <label class="mb-1 block text-xs font-medium text-slate-600">Desde</label>
        <input id="bitacoraDesde" type="date" class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white" />
      </div>
      <div>
        <label class="mb-1 block text-xs font-medium text-slate-600">Hasta</label>
        <input id="bitacoraHasta" type="date" class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white" />
      </div>
      <div>
        <label class="mb-1 block text-xs font-medium text-slate-600">Tipo</label>
        <select id="bitacoraTipo" class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white">
          <option value="">Todos</option>
          <option value="persona_recurrente">Personal recurrente</option>
          <option value="visitante_rapido">Visitante rápido</option>
          <option value="permiso_material">Permiso material</option>
          <option value="incidencia">Incidencia</option>
          <option value="reporte_operativo">Reporte operativo</option>
        </select>
      </div>
      <div class="flex items-end">
        <button type="submit" class="min-h-11 w-full rounded-xl bg-[#2E5D73] px-4 text-sm font-semibold text-white shadow-sm transition hover:opacity-95">Actualizar</button>
      </div>
    </form>
  </div>

  <div id="bitacoraAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>
  <div id="bitacoraSummary" class="grid gap-4 md:grid-cols-3 app-mobile-hide"></div>
  <div id="bitacoraList" class="space-y-3 app-mobile-scroll-list"></div>
</div>

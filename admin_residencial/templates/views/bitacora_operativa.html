<div id="bitacoraOperativaView" class="space-y-4">
  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="text-[11px] uppercase tracking-[0.18em] text-slate-400">Reporte operativo</div>
    <h1 class="mt-1 text-2xl font-semibold text-slate-800">Bitácora del día</h1>
    <p class="mt-1 text-sm text-slate-500">Consulta movimientos, resultados y evidencia de caseta por fecha.</p>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <form id="bitacoraFilters" class="grid gap-3 md:grid-cols-4">
      <div>
        <label class="mb-1 block text-xs text-slate-600">Desde</label>
        <input id="bitacoraDesde" type="date" class="w-full rounded-xl border px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="mb-1 block text-xs text-slate-600">Hasta</label>
        <input id="bitacoraHasta" type="date" class="w-full rounded-xl border px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="mb-1 block text-xs text-slate-600">Tipo</label>
        <select id="bitacoraTipo" class="w-full rounded-xl border px-3 py-2 text-sm">
          <option value="">Todos</option>
          <option value="persona_recurrente">Personal recurrente</option>
          <option value="visitante_rapido">Visitante rápido</option>
          <option value="permiso_material">Permiso material</option>
          <option value="incidencia">Incidencia</option>
          <option value="reporte_operativo">Reporte operativo</option>
        </select>
      </div>
      <div class="flex items-end">
        <button type="submit" class="w-full rounded-xl bg-[#2E5D73] px-4 py-2 text-sm font-semibold text-white hover:opacity-95">Actualizar</button>
      </div>
    </form>
  </div>

  <div id="bitacoraAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>
  <div id="bitacoraSummary" class="grid gap-4 md:grid-cols-3 app-mobile-hide"></div>
  <div id="bitacoraList" class="space-y-3 app-mobile-scroll-list"></div>
</div>

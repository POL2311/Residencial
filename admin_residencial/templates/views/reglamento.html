<div id="reglamentoView" class="space-y-4">
  <div id="reglamentoAlert" class="hidden rounded-lg px-4 py-3 text-sm"></div>
  <form id="reglamentoForm" class="space-y-3">
    <div>
      <label class="block text-sm font-medium mb-1">Título del reglamento</label>
      <input type="text" name="titulo" class="w-full border border-slate-300 rounded-md px-3 py-1" required />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Contenido</label>
      <textarea name="contenido" rows="10" class="w-full border border-slate-300 rounded-md px-3 py-2" required></textarea>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Versión / Nota</label>
      <input type="text" name="version_label" class="w-full border border-slate-300 rounded-md px-3 py-1" />
    </div>
    <div>
      <button type="submit" class="bg-green-600 text-white text-sm font-semibold px-4 py-2 rounded-md hover:bg-green-700">Guardar reglamento</button>
    </div>
  </form>
</div>

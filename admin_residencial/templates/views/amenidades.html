<div id="adminAmenidadesView" class="space-y-4">
  <div class="rounded-[2rem] border border-slate-200/40 bg-white/60 backdrop-blur-xl p-5 shadow-sm">
    <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
      <div>
        <div class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Reservas residenciales</div>
        <h1 class="text-3xl font-semibold text-slate-700">Amenidades</h1>
        <p class="mt-1 text-sm text-slate-500">Administra espacios compartidos y revisa las solicitudes enviadas por residentes.</p>
      </div>
      <button id="btnNuevaAmenidadAdmin" type="button" class="shrink-0 rounded-2xl bg-[#2E5D73] px-6 py-3 text-sm font-semibold text-white shadow-sm hover:opacity-95">
        Nueva amenidad
      </button>
    </div>
  </div>

  <div id="amenidadesAdminAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div class="flex flex-wrap gap-2">
    <button type="button" data-amenidades-tab="solicitudes" class="rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700">Solicitudes</button>
    <button type="button" data-amenidades-tab="catalogo" class="rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700">Catálogo</button>
  </div>

  <section id="amenidadesSolicitudesSection" class="space-y-3">
    <div class="rounded-[2rem] border border-slate-200/40 bg-white/60 backdrop-blur-xl p-5 shadow-sm">
      <div class="grid gap-3 md:grid-cols-[1fr_1fr_auto] md:items-end">
        <div>
          <label class="mb-1 block text-xs text-slate-500">Estado</label>
          <select id="amenidadesAdminEstado" class="w-full rounded-2xl border-0 py-3 px-4 ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-inset focus:ring-[#2E5D73] bg-white transition-all shadow-sm text-sm">
            <option value="">Todos</option>
            <option value="pendiente">Pendientes</option>
            <option value="aprobada">Aprobadas</option>
            <option value="rechazada">Rechazadas</option>
            <option value="cancelada">Canceladas</option>
          </select>
        </div>
        <div>
          <label class="mb-1 block text-xs text-slate-500">Desde</label>
          <input id="amenidadesAdminFechaDesde" type="date" class="w-full rounded-2xl border-0 py-3 px-4 ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-inset focus:ring-[#2E5D73] bg-white transition-all shadow-sm text-sm" />
        </div>
        <button id="btnFiltrarAmenidadesAdmin" type="button" class="rounded-2xl bg-white border border-slate-200 px-4 py-2 hover:bg-slate-50 transition-colors text-sm font-semibold text-slate-700">
          Filtrar
        </button>
      </div>
    </div>
    <div id="amenidadesAdminReservasList" class="space-y-3"></div>
  </section>

  <section id="amenidadesCatalogoSection" class="hidden space-y-3">
    <div id="amenidadesAdminCatalogoList" class="grid gap-3 lg:grid-cols-2"></div>
  </section>

  <div id="amenidadAdminModal" class="hidden fixed inset-0 w-screen h-[100dvh] w-screen h-[100dvh] z-50 bg-black/60 backdrop-blur-sm">
    <div class="min-h-full flex items-end md:items-center justify-center p-3 md:p-4">
      <div class="flex max-h-[80dvh] w-full max-w-xl flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl sm:rounded-3xl">
        <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3">
          <div id="amenidadAdminModalTitle" class="text-sm font-semibold text-slate-800">Amenidad</div>
          <button id="btnCloseAmenidadAdminModal" type="button" class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200">✕</button>
        </div>
        <form id="amenidadAdminForm" class="flex min-h-0 flex-1 flex-col">
          <input type="hidden" name="id" />
          <div class="flex-1 space-y-3 overflow-y-auto p-4">
            <div>
              <label class="mb-1 block text-xs text-slate-600">Nombre</label>
              <input name="nombre" class="w-full rounded-2xl border-0 py-3 px-4 ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-inset focus:ring-[#2E5D73] bg-white transition-all shadow-sm text-sm" required />
            </div>
            <div class="grid gap-3 md:grid-cols-2">
              <div>
                <label class="mb-1 block text-xs text-slate-600">Ubicación</label>
                <input name="ubicacion" class="w-full rounded-2xl border-0 py-3 px-4 ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-inset focus:ring-[#2E5D73] bg-white transition-all shadow-sm text-sm" />
              </div>
              <div>
                <label class="mb-1 block text-xs text-slate-600">Capacidad</label>
                <input name="capacidad" type="number" min="0" class="w-full rounded-2xl border-0 py-3 px-4 ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-inset focus:ring-[#2E5D73] bg-white transition-all shadow-sm text-sm" />
              </div>
            </div>
            <div>
              <label class="mb-1 block text-xs text-slate-600">Descripción</label>
              <textarea name="descripcion" rows="4" class="w-full rounded-2xl border-0 py-3 px-4 ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-inset focus:ring-[#2E5D73] bg-white transition-all shadow-sm text-sm"></textarea>
            </div>
            <label class="flex items-center gap-2 text-sm text-slate-600">
              <input type="checkbox" name="activo" value="1" checked />
              Disponible para residentes
            </label>
          </div>
          <div class="flex flex-col-reverse gap-2 border-t border-slate-100 bg-white px-4 py-3 sm:flex-row sm:justify-end">
            <button id="btnCancelAmenidadAdminModal" type="button" class="rounded-2xl bg-white border border-slate-200 px-4 py-2 hover:bg-slate-50 transition-colors text-sm text-slate-700 hover:bg-slate-50">Cancelar</button>
            <button type="submit" class="rounded-2xl bg-[#2E5D73] px-6 py-3 text-white shadow-sm hover:opacity-95 text-sm font-semibold">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="amenidadReviewModal" class="hidden fixed inset-0 w-screen h-[100dvh] w-screen h-[100dvh] z-50 bg-black/60 backdrop-blur-sm">
    <div class="min-h-full flex items-end md:items-center justify-center p-3 md:p-4">
      <div class="flex max-h-[80dvh] w-full max-w-md flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl sm:rounded-3xl">
        <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3">
          <div id="amenidadReviewTitle" class="text-sm font-semibold text-slate-800">Revisar solicitud</div>
          <button id="btnCloseAmenidadReviewModal" type="button" class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200">✕</button>
        </div>
        <form id="amenidadReviewForm" class="flex min-h-0 flex-1 flex-col p-4">
          <div class="flex-1 space-y-3 overflow-y-auto">
          <input type="hidden" name="id" />
          <input type="hidden" name="decision" />
          <div id="amenidadReviewSummary" class="rounded-2xl border border-slate-200 bg-slate-50 p-3 text-sm text-slate-700"></div>
          <div>
            <label class="mb-1 block text-xs text-slate-600">Notas administrativas</label>
            <textarea name="notas_admin" rows="3" class="w-full rounded-2xl border-0 py-3 px-4 ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-inset focus:ring-[#2E5D73] bg-white transition-all shadow-sm text-sm"></textarea>
          </div>
          </div>
          <div class="mt-4 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end border-t border-slate-100 pt-4">
            <button id="btnCancelAmenidadReviewModal" type="button" class="rounded-2xl bg-white border border-slate-200 px-4 py-2 hover:bg-slate-50 transition-colors text-sm text-slate-700 hover:bg-slate-50">Cancelar</button>
            <button id="btnSubmitAmenidadReview" type="submit" class="rounded-2xl bg-[#2E5D73] px-6 py-3 text-sm font-medium text-white shadow-sm hover:opacity-95">Confirmar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

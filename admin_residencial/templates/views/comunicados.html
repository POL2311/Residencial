<div id="comunicadosView" class="space-y-4">

  <div id="comunicadosAlert"
       class="hidden rounded-xl px-4 py-3 text-sm"></div>

  <div class="flex justify-end">
    <button id="btnAddComunicado"
      class="bg-blue-600 text-white text-sm font-semibold px-4 py-2 rounded-lg hover:bg-blue-700">
      + Nuevo comunicado
    </button>
  </div>

  <!-- LISTA -->
  <div id="comunicadosList" class="space-y-3"></div>

  <!-- MODAL -->
  <div id="comunicadoModal"
       class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg">

      <div class="flex justify-between items-center border-b px-4 py-3">
        <h2 class="text-lg font-semibold">Comunicado</h2>
        <button id="btnCloseComModal"
                class="text-xl font-semibold">&times;</button>
      </div>

      <form id="comunicadoForm" class="px-4 py-4 space-y-3">
        <input type="hidden" name="id" />

        <div>
          <label class="block text-sm font-medium mb-1">Título</label>
          <input name="titulo" required
            class="w-full border rounded-lg px-3 py-2" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Mensaje</label>
          <textarea name="mensaje" rows="4" required
            class="w-full border rounded-lg px-3 py-2"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <select name="tipo" class="border rounded-lg px-2 py-2">
            <option value="general">General</option>
            <option value="mantenimiento">Mantenimiento</option>
            <option value="seguridad">Seguridad</option>
            <option value="pagos">Pagos</option>
          </select>

          <select name="prioridad" class="border rounded-lg px-2 py-2">
            <option value="baja">Baja</option>
            <option value="media">Media</option>
            <option value="alta">Alta</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <input type="date" name="fecha_publicacion"
                 class="border rounded-lg px-2 py-2" />
          <input type="date" name="fecha_expiracion"
                 class="border rounded-lg px-2 py-2" />
        </div>

        <select name="estado" class="border rounded-lg px-2 py-2">
          <option value="publicado">Publicado</option>
          <option value="borrador">Borrador</option>
        </select>

        <div class="text-right pt-2">
          <button
            class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
            Guardar
          </button>
        </div>
      </form>

    </div>
  </div>
</div>

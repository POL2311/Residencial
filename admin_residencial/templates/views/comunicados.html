<div id="comunicadosView" class="space-y-4">
  <div id="comunicadosAlert" class="hidden rounded-lg px-4 py-3 text-sm"></div>

  <div class="flex justify-end">
    <button id="btnAddComunicado" class="bg-blue-600 text-white text-sm font-semibold px-4 py-2 rounded-md hover:bg-blue-700">+ Nuevo comunicado</button>
  </div>

  <div id="comunicadosList" class="space-y-3"></div>

  <!-- Modal Agregar/Editar Comunicado -->
  <div id="comunicadoModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg">
      <div class="flex justify-between items-center border-b px-4 py-2">
        <h2 class="text-lg font-semibold">Comunicado</h2>
        <button id="btnCloseComModal" class="text-xl font-semibold">&times;</button>
      </div>
      <form id="comunicadoForm" class="px-4 py-3 space-y-3">
        <input type="hidden" name="id" />
        <div>
          <label class="block text-sm font-medium mb-1">Título</label>
          <input type="text" name="titulo" class="w-full border border-slate-300 rounded-md px-3 py-1" required />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Mensaje</label>
          <textarea name="mensaje" rows="4" class="w-full border border-slate-300 rounded-md px-3 py-1" required></textarea>
        </div>
        <div class="flex space-x-2">
          <div class="flex-1">
            <label class="block text-sm font-medium mb-1">Categoría</label>
            <select name="tipo" class="w-full border border-slate-300 rounded-md px-2 py-1">
              <option value="general">General</option>
              <option value="mantenimiento">Mantenimiento</option>
              <option value="seguridad">Seguridad</option>
              <option value="pagos">Pagos</option>
              <option value="otro">Otro</option>
            </select>
          </div>
          <div class="flex-1">
            <label class="block text-sm font-medium mb-1">Prioridad</label>
            <select name="prioridad" class="w-full border border-slate-300 rounded-md px-2 py-1">
              <option value="baja">Baja</option>
              <option value="media" selected>Media</option>
              <option value="alta">Alta</option>
            </select>
          </div>
        </div>
        <div class="flex space-x-2">
          <div class="flex-1">
            <label class="block text-sm font-medium mb-1">Fecha publicación</label>
            <input type="date" name="fecha_publicacion" class="w-full border border-slate-300 rounded-md px-2 py-1" />
          </div>
          <div class="flex-1">
            <label class="block text-sm font-medium mb-1">Fecha expiración</label>
            <input type="date" name="fecha_expiracion" class="w-full border border-slate-300 rounded-md px-2 py-1" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Estado</label>
          <select name="estado" class="w-full border border-slate-300 rounded-md px-2 py-1">
            <option value="publicado">Publicado</option>
            <option value="borrador">Borrador</option>
          </select>
        </div>
        <div class="text-right pt-2">
          <button type="submit" class="bg-green-600 text-white text-sm font-semibold px-4 py-2 rounded-md hover:bg-green-700">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>

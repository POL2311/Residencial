<div id="comunicadosView" class="space-y-5">

  <div id="comunicadosAlert"
       class="hidden rounded-xl px-4 py-3 text-sm"></div>

  <!-- HEADER -->
  <div class="rounded-[1.75rem] border border-slate-200 bg-white p-5 shadow-sm">
    <div>
      <div class="app-admin-kicker">Comunicación interna</div>
      <h1 class="app-admin-title" data-os-label="notices">Comunicados</h1>
      <p class="app-admin-subtitle">
        Administra avisos, borradores y publicaciones activas del servicio.
      </p>
    </div>
    <div class="mt-4 flex justify-end">
      <button id="btnAddComunicado"
        class="app-admin-primary rounded-full px-5 py-2.5 text-sm font-semibold"
        data-os-label="new_bulletin">
        + Nuevo comunicado
      </button>
    </div>
  </div>

  <!-- FILTROS -->
  <div class="rounded-[1.75rem] border border-slate-200 bg-white p-4 shadow-sm">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
      <div>
        <label class="block text-xs text-slate-500 mb-1">Buscar</label>
        <input
          id="comunicadoSearch"
          type="text"
          placeholder="Título, mensaje, tipo..."
          class="w-full rounded-xl border px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200"
        />
      </div>

      <div>
        <label class="block text-xs text-slate-500 mb-1">Estado</label>
        <select id="comunicadoFilterEstado" class="w-full rounded-xl border px-3 py-3 text-sm">
          <option value="todos">Todos</option>
          <option value="publicado">Publicados</option>
          <option value="borrador">Borradores</option>
        </select>
      </div>

      <div>
        <label class="block text-xs text-slate-500 mb-1">Prioridad</label>
        <select id="comunicadoFilterPrioridad" class="w-full rounded-xl border px-3 py-3 text-sm">
          <option value="todas">Todas</option>
          <option value="alta">Alta</option>
          <option value="media">Media</option>
          <option value="baja">Baja</option>
        </select>
      </div>

      <div class="flex items-end">
        <button id="btnResetComunicadosFilters"
          type="button"
          class="w-full rounded-xl border px-4 py-3 text-sm hover:bg-slate-50">
          Limpiar filtros
        </button>
      </div>
    </div>
  </div>

  <!-- LISTA -->
  <div id="comunicadosList" class="space-y-3 app-mobile-scroll-list"></div>

  <!-- PAGINACIÓN -->
  <div id="comunicadosPagination" class="flex flex-wrap justify-end gap-2"></div>

  <!-- MODAL -->
  <div id="comunicadoModal"
       class="os-modal-v2 hidden z-50">
    <div class="os-modal-v2__backdrop" data-close-modal></div>
    <section class="os-modal-v2__panel os-modal-v2__panel--form os-modal-v2__panel--compact" role="dialog" aria-modal="true" aria-labelledby="comunicadoModalTitle">

      <header class="os-modal-v2__header">
        <div>
          <div class="os-modal-v2__eyebrow" data-os-label="bulletin">Comunicado</div>
          <h2 id="comunicadoModalTitle" data-os-label="bulletin">Comunicado</h2>
        </div>
        <button id="btnCloseComModal"
                class="os-modal-v2__close" data-close-modal aria-label="Cerrar">
          ×
        </button>
      </header>

      <form id="comunicadoForm" class="os-form-v2" enctype="multipart/form-data">
        <div class="os-modal-v2__body space-y-3">
        <div id="comunicadoFormError"
             class="hidden rounded-xl bg-rose-100 text-rose-700 px-4 py-3 text-sm"></div>

        <input type="hidden" name="id" />
        <input type="hidden" name="imagen_url" />

        <div>
          <label class="block text-sm font-medium mb-1">Título</label>
          <input name="titulo" required
            class="w-full border rounded-lg px-3 py-2" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Mensaje</label>
          <textarea name="mensaje" rows="5" required
            class="w-full border rounded-lg px-3 py-2"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Fotografía (opcional)</label>
          <input
            type="file"
            name="imagen"
            accept="image/jpeg,image/png,image/webp"
            class="w-full rounded-lg border bg-white px-3 py-2 text-sm" />
          <div class="mt-2 flex items-center gap-3">
            <img id="comunicadoImagePreview" alt=""
                 class="hidden h-14 w-14 rounded-xl border border-slate-200 object-cover" />
            <div class="text-xs text-slate-500">
              Si subes una nueva imagen al editar, reemplazará la actual.
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <select name="tipo" class="border rounded-lg px-2 py-2">
            <option value="general">General</option>
            <option value="mantenimiento">Mantenimiento</option>
            <option value="seguridad">Seguridad</option>
            <option value="pagos">Pagos</option>
          </select>

          <select name="prioridad" class="border rounded-lg px-2 py-2">
            <option value="baja">Baja</option>
            <option value="media">Media</option>
            <option value="alta">Alta</option>
          </select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <input type="date" name="fecha_publicacion"
                 class="border rounded-lg px-2 py-2" />
          <input type="date" name="fecha_expiracion"
                 class="border rounded-lg px-2 py-2" />
        </div>

        <select name="estado" class="border rounded-lg px-2 py-2">
          <option value="publicado">Publicado</option>
          <option value="borrador">Borrador</option>
        </select>

        </div>
        <footer class="os-modal-v2__footer">
          <button type="button" id="btnCancelComModal"
            class="text-sm px-4 py-2 rounded-lg border hover:bg-slate-50" data-close-modal>
            Cancelar
          </button>
          <button
            type="submit"
            class="rounded-xl bg-[#2E5D73] px-4 py-2 text-sm font-semibold text-white shadow hover:opacity-95"
            data-os-label="save_bulletin">
            Guardar comunicado
          </button>
        </footer>
      </form>

    </section>
  </div>
</div>

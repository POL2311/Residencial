<div id="unidadesView" class="space-y-4">

  <!-- ALERT -->
  <div id="unidadesAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <!-- HEADER -->
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <div class="text-[11px] uppercase tracking-[0.18em] text-slate-400">Operación del residencial</div>
      <h1 class="mt-1 text-2xl font-semibold text-slate-800">Unidades</h1>
    </div>

    <button
      id="btnAddUnidad"
      class="hidden text-xs px-4 py-2 rounded-full bg-[#2E5D73] text-white hover:opacity-95">
      Agregar
    </button>
  </div>

  <!-- EMPTY -->
  <div id="unidadesEmpty" class="hidden">
    <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-600">
      No hay unidades registradas.
    </div>
  </div>

<div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
  <input
    id="unidadSearch"
    type="text"
    placeholder="Buscar Unidad"
    class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm"
  />
</div>
  <div class="hidden md:grid grid-cols-4 gap-4 rounded-2xl border border-slate-200 bg-white/70 px-5 py-3 text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-500 shadow-sm">
  <div>Unidad</div>
  <div>Detalle</div>
  <div class="text-center">Titular</div>
  <div class="text-right">Acciones</div>
</div>


  <!-- LIST -->
  <div id="unidadesList" class="space-y-3"></div>

  <!-- MODAL -->
  <div id="modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm">
    <div class="min-h-full flex items-end md:items-center justify-center p-0 md:p-4">
      <div class="app-admin-modal-card w-full md:max-w-lg bg-white md:rounded-2xl rounded-t-2xl shadow-2xl">

        <div class="app-admin-modal-header px-4 py-3 border-b border-slate-100 flex items-center justify-between">
          <div id="modalTitle" class="text-sm font-semibold text-slate-800">—</div>
          <button id="btnCloseModal"
            class="h-9 w-9 rounded-full bg-slate-100 hover:bg-slate-200">✕</button>
        </div>

        <form id="modalForm" class="flex min-h-0 flex-1 flex-col">
          <div class="app-admin-modal-body p-4 space-y-4">

          <input type="hidden" name="action">
          <input type="hidden" name="id">

          <div>
            <label class="block text-xs text-slate-600 mb-1">Clave *</label>
            <input name="clave" required
              class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
          </div>

          <div>
            <label class="block text-xs text-slate-600 mb-1">Torre</label>
            <input name="torre"
              class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
          </div>

          <div>
            <label class="block text-xs text-slate-600 mb-1">Tipo *</label>
            <select name="tipo" required
              class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
              <option value="casa">Casa</option>
              <option value="departamento">Departamento</option>
              <option value="local">Local</option>
              <option value="otro">Otro</option>
            </select>
          </div>

          </div>
          <div class="app-admin-modal-footer border-t border-slate-100 bg-white px-4 py-3 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
            <button type="button" id="btnCancelModal"
              class="text-sm px-4 py-2 rounded-xl border">
              Cancelar
            </button>
            <button type="submit"
              class="text-sm px-4 py-2 rounded-xl bg-[#2E5D73] text-white">
              Guardar
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>

  <div id="detailModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm">
    <div class="min-h-full flex items-center justify-center p-4">
      <div id="detailModalContent"
        class="app-admin-modal-card app-admin-modal-body w-full max-w-2xl bg-white rounded-2xl shadow-2xl p-4">
      </div>
    </div>
  </div>

<div id="unidadesView" class="space-y-4">

  <!-- ALERT -->
  <div id="unidadesAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <!-- HEADER -->
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <div class="text-[11px] uppercase tracking-[0.18em] text-slate-400">Operación del residencial</div>
      <h1 class="mt-1 text-2xl font-semibold text-slate-800">Unidades</h1>
    </div>

    <button
      id="btnAddUnidad"
      class="hidden text-xs px-4 py-2 rounded-full bg-[#2E5D73] text-white hover:opacity-95">
      Agregar
    </button>
  </div>

  <!-- EMPTY -->
  <div id="unidadesEmpty" class="hidden">
    <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-600">
      No hay unidades registradas.
    </div>
  </div>

  <div class="rounded-[1.75rem] border border-slate-200 bg-white p-5 shadow-sm">
    <input
      id="unidadSearch"
      type="text"
      placeholder="Buscar Unidad..."
      class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white"
    />
  </div>

  <div class="hidden md:grid grid-cols-4 gap-4 rounded-2xl border border-slate-200 bg-white/70 px-5 py-3 text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-500 shadow-sm">
    <div>Unidad</div>
    <div>Detalle</div>
    <div class="text-center">Titular</div>
    <div class="text-right">Acciones</div>
  </div>


  <!-- LIST -->
  <div id="unidadesList" class="space-y-3"></div>

  <!-- MODAL -->
  <div id="modal" class="hidden fixed inset-0 z-[999] bg-black/60 backdrop-blur-sm">
    <div class="flex min-h-dvh w-full items-center justify-center p-4 pointer-events-none">
      <div class="flex max-h-[calc(100dvh-2rem)] w-full max-w-md flex-col overflow-hidden rounded-[1.35rem] bg-white shadow-2xl sm:max-h-[min(86dvh,640px)] sm:max-w-lg pointer-events-auto">

        <div class="flex shrink-0 items-start justify-between gap-3 border-b border-slate-100 px-4 py-3">
          <div class="min-w-0">
            <h2 id="modalTitle" class="text-base font-semibold leading-tight text-slate-900">—</h2>
            <p class="mt-1 text-xs leading-5 text-slate-500">Completa los campos para guardar la información de la unidad.</p>
          </div>
          <button id="btnCloseModal" type="button" aria-label="Cerrar formulario"
            class="h-11 w-11 shrink-0 rounded-full bg-slate-100 text-slate-700 transition hover:bg-slate-200 flex items-center justify-center">✕</button>
        </div>

        <form id="modalForm" class="flex min-h-0 flex-1 flex-col">
          <div class="flex-1 space-y-4 overflow-y-auto overscroll-contain px-4 py-3">

            <input type="hidden" name="action">
            <input type="hidden" name="id">

            <div>
              <label class="mb-1 block text-xs font-medium text-slate-600">Clave *</label>
              <input name="clave" required placeholder="Ej. A-101"
                class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white">
            </div>

            <div>
              <label class="mb-1 block text-xs font-medium text-slate-600">Torre</label>
              <input name="torre" placeholder="Ej. Torre 1"
                class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white">
            </div>

            <div>
              <label class="mb-1 block text-xs font-medium text-slate-600">Tipo *</label>
              <div class="grid grid-cols-4 gap-1.5 rounded-xl bg-slate-100 p-1">
                <label class="relative block cursor-pointer">
                  <input type="radio" name="tipo" value="casa" required class="peer sr-only">
                  <span class="flex min-h-9 items-center justify-center rounded-lg text-xs font-medium text-slate-600 transition peer-checked:bg-white peer-checked:text-[#2E5D73] peer-checked:shadow-sm">Casa</span>
                </label>
                <label class="relative block cursor-pointer">
                  <input type="radio" name="tipo" value="departamento" class="peer sr-only">
                  <span class="flex min-h-9 items-center justify-center rounded-lg text-xs font-medium text-slate-600 transition peer-checked:bg-white peer-checked:text-[#2E5D73] peer-checked:shadow-sm">Depto</span>
                </label>
                <label class="relative block cursor-pointer">
                  <input type="radio" name="tipo" value="local" class="peer sr-only">
                  <span class="flex min-h-9 items-center justify-center rounded-lg text-xs font-medium text-slate-600 transition peer-checked:bg-white peer-checked:text-[#2E5D73] peer-checked:shadow-sm">Local</span>
                </label>
                <label class="relative block cursor-pointer">
                  <input type="radio" name="tipo" value="otro" class="peer sr-only">
                  <span class="flex min-h-9 items-center justify-center rounded-lg text-xs font-medium text-slate-600 transition peer-checked:bg-white peer-checked:text-[#2E5D73] peer-checked:shadow-sm">Otro</span>
                </label>
              </div>
            </div>

          </div>
          <div class="flex shrink-0 items-center gap-2 border-t border-slate-100 bg-white px-4 py-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))]">
            <button type="button" id="btnCancelModal"
              class="min-h-11 rounded-xl border border-slate-200 bg-white px-4 text-sm font-medium text-slate-700 transition hover:bg-slate-50">
              Cancelar
            </button>
            <button type="submit"
              class="min-h-11 flex-1 rounded-xl bg-[#2E5D73] px-4 text-sm font-semibold text-white shadow-sm transition hover:opacity-95">
              Guardar
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>

  <div id="detailModal" class="hidden fixed inset-0 z-[999] bg-black/60 backdrop-blur-sm">
    <div class="flex min-h-dvh w-full items-center justify-center p-4 pointer-events-none">
      <div id="detailModalContent"
        class="flex max-h-[calc(100dvh-2rem)] w-full max-w-2xl flex-col overflow-hidden rounded-[1.35rem] bg-white shadow-2xl sm:max-h-[min(86dvh,640px)] pointer-events-auto">
      </div>
    </div>
  </div>

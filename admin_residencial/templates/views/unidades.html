<div id="unidadesView" class="space-y-4">

  <!-- ALERT -->
  <div id="unidadesAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <!-- HEADER -->
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <div class="text-[11px] uppercase tracking-[0.18em] text-slate-400">Operación del servicio</div>
      <h1 class="mt-1 text-2xl font-semibold text-slate-800" data-os-label="units">Unidades</h1>
    </div>

    <button
      id="btnAddUnidad"
      class="hidden text-xs px-4 py-2 rounded-full bg-[#2E5D73] text-white hover:opacity-95">
      Agregar
    </button>
  </div>

  <!-- EMPTY -->
  <div id="unidadesEmpty" class="hidden">
    <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-600">
      No hay unidades registradas.
    </div>
  </div>

<div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
  <input
    id="unidadSearch"
    type="text"
    placeholder="Buscar unidad o área"
    class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm"
  />
</div>
  <div class="hidden md:grid grid-cols-4 gap-4 rounded-2xl border border-slate-200 bg-white/70 px-5 py-3 text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-500 shadow-sm">
  <div data-os-label="units">Unidad</div>
  <div>Detalle</div>
  <div class="text-center">Titular</div>
  <div class="text-right">Acciones</div>
</div>


  <!-- LIST -->
  <div id="unidadesList" class="space-y-3"></div>

  <!-- MODAL -->
  <div id="modal" class="os-modal-v2 hidden z-50">
    <div class="os-modal-v2__backdrop" data-close-modal></div>
      <section class="os-modal-v2__panel os-modal-v2__panel--compact os-modal-v2__panel--form" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

        <header class="os-modal-v2__header">
          <div>
            <div class="os-modal-v2__eyebrow">Unidades</div>
            <h2 id="modalTitle">—</h2>
          </div>
          <button id="btnCloseModal"
            class="os-modal-v2__close" data-close-modal aria-label="Cerrar">×</button>
        </header>

        <form id="modalForm" class="os-form-v2">
          <div class="os-modal-v2__body space-y-4">

          <input type="hidden" name="action">
          <input type="hidden" name="id">

          <div>
            <label class="block text-xs text-slate-600 mb-1">Clave *</label>
            <input name="clave" required
              class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
          </div>

          <div>
            <label class="block text-xs text-slate-600 mb-1">Torre</label>
            <input name="torre"
              class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
          </div>

          <div>
            <label class="block text-xs text-slate-600 mb-1">Tipo *</label>
            <select name="tipo" required
              class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
              <option value="casa">Casa</option>
              <option value="departamento">Departamento</option>
              <option value="local">Local</option>
              <option value="otro">Otro</option>
            </select>
          </div>

          </div>
          <footer class="os-modal-v2__footer">
            <button type="button" id="btnCancelModal"
              class="text-sm px-4 py-2 rounded-xl border" data-close-modal>
              Cancelar
            </button>
            <button type="submit"
              class="text-sm px-4 py-2 rounded-xl bg-[#2E5D73] text-white">
              Guardar
            </button>
          </footer>

        </form>
      </section>
  </div>

  <div id="detailModal" class="os-modal-v2 hidden z-50">
    <div class="os-modal-v2__backdrop" data-close-modal></div>
      <div id="detailModalContent"
        class="os-modal-v2__panel os-modal-v2__panel--wide os-modal-v2__body bg-white p-4">
      </div>
  </div>

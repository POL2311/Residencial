<div id="perfilView" class="space-y-3">

  <div id="perfilAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="text-[11px] uppercase tracking-[0.18em] text-slate-400">Configuración general</div>
    <h1 class="mt-1 text-2xl font-semibold text-slate-800">Perfil del residencial</h1>
  </div>

  <!-- MI RESIDENCIAL -->
  <section class="rounded-2xl bg-white shadow overflow-hidden">
    <button class="w-full px-4 py-4 flex justify-between hover:bg-slate-50"
            data-acc-btn="residencial">
      <div>
        <div class="text-base font-semibold">Mi residencial</div>
        <div class="text-xs text-slate-500">Información general</div>
      </div>
      <span class="h-9 w-9 rounded-full bg-slate-100 flex items-center justify-center">
        <svg data-acc-ico="residencial" class="w-4 h-4 transition-transform" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M7.21 14.77L10.94 10 7.23 6.29l1.06-1.06 4.24 4.24-4.24 4.24z"/>
        </svg>
      </span>
    </button>

    <div data-acc-body="residencial" class="hidden border-t">
      <div class="p-4 space-y-2">
        <div>
          <div class="text-xs text-slate-500">Nombre</div>
          <div id="v_res_nombre" class="text-sm font-semibold">—</div>
        </div>
        <div>
          <div class="text-xs text-slate-500">Ubicación</div>
          <div id="v_res_ubicacion" class="text-sm font-semibold">—</div>
        </div>
      </div>
    </div>
  </section>

  <!-- MI USUARIO -->
  <section class="rounded-2xl bg-white shadow overflow-hidden">
    <button class="w-full px-4 py-4 flex justify-between hover:bg-slate-50"
            data-acc-btn="usuario">
      <div>
        <div class="text-base font-semibold">Mi usuario</div>
        <div class="text-xs text-slate-500">Datos de acceso y contacto</div>
      </div>
      <span class="h-9 w-9 rounded-full bg-slate-100 flex items-center justify-center">
        <svg data-acc-ico="usuario" class="w-4 h-4 transition-transform" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M7.21 14.77L10.94 10 7.23 6.29l1.06-1.06 4.24 4.24-4.24 4.24z"/>
        </svg>
      </span>
    </button>

    <div data-acc-body="usuario" class="hidden border-t">
      <form id="perfilUserForm" class="p-4 space-y-3">
        <div>
          <label for="perfilUserName" class="text-xs text-slate-500">Nombre</label>
          <input id="perfilUserName" name="name" type="text" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-base" required>
        </div>
        <div>
          <label for="perfilUserEmail" class="text-xs text-slate-500">Email</label>
          <input id="perfilUserEmail" name="email" type="email" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-base" required>
        </div>
        <div>
          <label for="perfilUserTelefono" class="text-xs text-slate-500">Teléfono</label>
          <input id="perfilUserTelefono" name="telefono" type="text" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-base" maxlength="20">
        </div>
        <div>
          <label for="perfilUserPassword" class="text-xs text-slate-500">Nueva contraseña (opcional)</label>
          <input id="perfilUserPassword" name="password" type="password" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-base" minlength="8" autocomplete="new-password">
        </div>
        <div>
          <label for="perfilUserPasswordConfirm" class="text-xs text-slate-500">Confirmar contraseña</label>
          <input id="perfilUserPasswordConfirm" name="password_confirm" type="password" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-base" minlength="8" autocomplete="new-password">
        </div>
        <div class="pt-1">
          <button id="perfilUserSaveBtn" type="submit" class="inline-flex items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">
            Guardar cambios
          </button>
        </div>
      </form>
    </div>
  </section>

  <!-- STATS -->
  <section class="rounded-2xl bg-white shadow overflow-hidden">
    <button class="w-full px-4 py-4 flex justify-between hover:bg-slate-50"
            data-acc-btn="stats">
      <div>
        <div class="text-base font-semibold">Resumen</div>
        <div class="text-xs text-slate-500">Usuarios del residencial</div>
      </div>
    </button>

    <div data-acc-body="stats" class="hidden border-t">
      <div class="p-4 grid grid-cols-2 gap-4">
        <div>
          <div class="text-xs text-slate-500">Residentes</div>
          <div id="v_stat_residentes" class="text-xl font-semibold">—</div>
        </div>
        <div>
          <div class="text-xs text-slate-500">Guardias</div>
          <div id="v_stat_guardias" class="text-xl font-semibold">—</div>
        </div>
      </div>
    </div>
  </section>

</div>

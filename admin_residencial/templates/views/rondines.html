<div id="adminRondinesView" class="space-y-5">
  <section class="rounded-[1.75rem] border border-slate-200 bg-white p-5 shadow-sm">
    <div class="app-admin-kicker" data-os-label="rounds">Rondines</div>
    <div class="mt-2 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
      <div>
        <h1 class="app-admin-title">Rondines digitales</h1>
        <p class="app-admin-subtitle">Configura rutas, puntos QR y revisa cumplimiento operativo con GPS, evidencia y bitácora.</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button id="btnRondinNewPoint" type="button" class="app-admin-ghost rounded-full px-4 py-2 text-sm font-semibold">Nuevo punto</button>
        <button id="btnRondinNewRoute" type="button" class="app-admin-primary rounded-full px-4 py-2 text-sm font-semibold">Nueva ruta</button>
      </div>
    </div>
  </section>

  <div id="rondinesAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <section class="rounded-2xl border border-slate-200 bg-white p-2 shadow-sm">
    <div class="grid gap-2 sm:grid-cols-3">
      <button type="button" data-rondines-tab="rutas" class="rondines-tab rounded-xl px-4 py-3 text-sm font-semibold text-slate-700">Rutas</button>
      <button type="button" data-rondines-tab="puntos" class="rondines-tab rounded-xl px-4 py-3 text-sm font-semibold text-slate-700">Puntos de revisión</button>
      <button type="button" data-rondines-tab="historial" class="rondines-tab rounded-xl px-4 py-3 text-sm font-semibold text-slate-700">Historial</button>
    </div>
  </section>

  <section id="rondinesRutasPanel" class="space-y-4">
    <div id="rondinesRutasList" class="grid gap-4 lg:grid-cols-2"></div>
  </section>

  <section id="rondinesPuntosPanel" class="hidden space-y-4">
    <div id="rondinesPuntosList" class="grid gap-4 lg:grid-cols-2"></div>
  </section>

  <section id="rondinesHistorialPanel" class="hidden space-y-4">
    <div id="rondinesHistorialList" class="space-y-3"></div>
  </section>

  <div id="rondinRouteModal" class="os-modal-v2 hidden z-[80]">
    <div class="os-modal-v2__backdrop" data-close-route-modal data-close-modal></div>
    <section class="os-modal-v2__panel os-modal-v2__panel--form os-modal-v2__panel--wide" role="dialog" aria-modal="true" aria-labelledby="rondinRouteModalTitle">
      <header class="os-modal-v2__header">
        <div>
          <div class="os-modal-v2__eyebrow" data-os-label="round_routes">Rutas de rondín</div>
          <h2 id="rondinRouteModalTitle">Nueva ruta</h2>
        </div>
        <button type="button" data-close-route-modal data-close-modal class="os-modal-v2__close" aria-label="Cerrar">×</button>
      </header>
      <form id="rondinRouteForm" class="os-form-v2">
        <div class="os-modal-v2__body space-y-4">
        <input type="hidden" name="id" />
        <div class="os-field-v2">
          <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Nombre</label>
          <input name="nombre" required maxlength="150" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-[#2E5D73]" />
        </div>
        <div class="os-field-v2">
          <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Descripción</label>
          <textarea name="descripcion" rows="3" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-[#2E5D73]"></textarea>
        </div>
        <label class="flex items-center gap-2 text-sm text-slate-600"><input name="activo" type="checkbox" value="1" checked /> Ruta activa</label>
        </div>
        <footer class="os-modal-v2__footer">
          <button type="button" data-close-route-modal data-close-modal class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-600">Cancelar</button>
          <button type="submit" class="app-admin-primary rounded-xl px-4 py-2 text-sm font-semibold">Guardar ruta</button>
        </footer>
      </form>
    </section>
  </div>

  <div id="rondinPointModal" class="os-modal-v2 hidden z-[80]">
    <div class="os-modal-v2__backdrop" data-close-point-modal data-close-modal></div>
    <section class="os-modal-v2__panel os-modal-v2__panel--wide os-modal-v2__panel--form" role="dialog" aria-modal="true" aria-labelledby="rondinPointModalTitle">
      <header class="os-modal-v2__header">
        <div>
          <div class="os-modal-v2__eyebrow" data-os-label="review_points">Puntos de revisión</div>
          <h2 id="rondinPointModalTitle">Nuevo punto</h2>
        </div>
        <button type="button" data-close-point-modal data-close-modal class="os-modal-v2__close" aria-label="Cerrar">×</button>
      </header>
      <form id="rondinPointForm" class="os-form-v2">
        <div class="os-modal-v2__body space-y-4">
        <input type="hidden" name="id" />
        <div class="os-form-v2__grid">
          <div class="os-field-v2">
            <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Nombre</label>
            <input name="nombre" required maxlength="150" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-[#2E5D73]" />
          </div>
          <div class="os-field-v2">
            <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500" data-os-label="area">Área</label>
            <select name="area_id" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-[#2E5D73]"></select>
          </div>
        </div>
        <div class="os-field-v2">
          <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Descripción</label>
          <textarea name="descripcion" rows="2" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-[#2E5D73]"></textarea>
        </div>
        <div class="os-form-v2__grid">
          <div class="os-field-v2">
            <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Latitud</label>
            <input name="latitud" inputmode="decimal" placeholder="19.4326000" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-[#2E5D73]" />
          </div>
          <div class="os-field-v2">
            <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Longitud</label>
            <input name="longitud" inputmode="decimal" placeholder="-99.1332000" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-[#2E5D73]" />
          </div>
          <div class="os-field-v2">
            <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Radio metros</label>
            <input name="radio_metros" type="number" min="5" max="5000" value="50" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-[#2E5D73]" />
          </div>
          <div class="flex items-end">
            <button id="btnUseCurrentGps" type="button" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-600">Usar GPS actual</button>
          </div>
        </div>
        <div class="grid gap-2 md:grid-cols-3">
          <label class="flex items-center gap-2 rounded-xl border border-slate-200 px-3 py-2 text-sm text-slate-600"><input name="requiere_foto" type="checkbox" value="1" /> Requiere foto</label>
          <label class="flex items-center gap-2 rounded-xl border border-slate-200 px-3 py-2 text-sm text-slate-600"><input name="requiere_observacion" type="checkbox" value="1" /> Requiere observación</label>
          <label class="flex items-center gap-2 rounded-xl border border-slate-200 px-3 py-2 text-sm text-slate-600"><input name="activo" type="checkbox" value="1" checked /> Punto activo</label>
        </div>
        <div id="rondinPointGpsHint" class="hidden rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs text-slate-500"></div>
        </div>
        <footer class="os-modal-v2__footer">
          <button type="button" data-close-point-modal data-close-modal class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-600">Cancelar</button>
          <button type="submit" class="app-admin-primary rounded-xl px-4 py-2 text-sm font-semibold">Guardar punto</button>
        </footer>
      </form>
    </section>
  </div>

  <div id="rondinAssignModal" class="os-modal-v2 hidden z-[80]">
    <div class="os-modal-v2__backdrop" data-close-assign-modal data-close-modal></div>
    <section class="os-modal-v2__panel os-modal-v2__panel--wide os-modal-v2__panel--form" role="dialog" aria-modal="true" aria-labelledby="rondinAssignTitle">
      <header class="os-modal-v2__header">
        <div>
          <div class="os-modal-v2__eyebrow">Asignación</div>
          <h2 id="rondinAssignTitle">Puntos de ruta</h2>
        </div>
        <button type="button" data-close-assign-modal data-close-modal class="os-modal-v2__close" aria-label="Cerrar">×</button>
      </header>
      <div class="os-modal-v2__body space-y-4">
        <div id="rondinAssignList" class="space-y-2"></div>
      </div>
      <footer class="os-modal-v2__footer">
          <button type="button" data-close-assign-modal data-close-modal class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-600">Cancelar</button>
          <button id="btnSaveRoutePoints" type="button" class="app-admin-primary rounded-xl px-4 py-2 text-sm font-semibold">Guardar puntos</button>
      </footer>
    </section>
  </div>

  <div id="rondinQrModal" class="os-modal-v2 hidden z-[90]">
    <div class="os-modal-v2__backdrop" data-close-qr-modal data-close-modal></div>
    <section class="os-modal-v2__panel os-modal-v2__panel--compact" role="dialog" aria-modal="true" aria-labelledby="rondinQrTitle">
      <header class="os-modal-v2__header">
        <div>
          <div class="os-modal-v2__eyebrow">QR de punto</div>
          <h2 id="rondinQrTitle">Punto</h2>
        </div>
        <button type="button" data-close-qr-modal data-close-modal class="os-modal-v2__close" aria-label="Cerrar">×</button>
      </header>
      <div class="os-modal-v2__body text-center">
        <div class="mx-auto inline-flex rounded-3xl border border-slate-200 bg-white p-3 shadow-sm">
          <img id="rondinQrImage" src="" alt="QR rondín" class="h-72 w-72 max-w-full rounded-2xl object-contain" />
        </div>
        <div id="rondinQrPayload" class="mt-4 break-all rounded-2xl bg-slate-50 px-4 py-3 text-left text-xs text-slate-500"></div>
      </div>
    </section>
  </div>

  <div id="rondinDetailModal" class="os-modal-v2 hidden z-[90]">
    <div class="os-modal-v2__backdrop" data-close-detail-modal data-close-modal></div>
    <section class="os-modal-v2__panel os-modal-v2__panel--wide os-modal-v2__panel--form" role="dialog" aria-modal="true" aria-labelledby="rondinDetailTitle">
      <header class="os-modal-v2__header">
        <div>
          <div class="os-modal-v2__eyebrow">Detalle de rondín</div>
          <h2 id="rondinDetailTitle">Historial</h2>
        </div>
        <button type="button" data-close-detail-modal data-close-modal class="os-modal-v2__close" aria-label="Cerrar">×</button>
      </header>
      <div id="rondinDetailBody" class="os-modal-v2__body"></div>
    </section>
  </div>
</div>

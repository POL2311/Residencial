<div id="guardiasView" class="space-y-5">

  <div id="guardiasAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div class="rounded-[1.75rem] border border-slate-200 bg-white p-5 shadow-sm">
    <div class="app-admin-kicker">Operación en sitio</div>
    <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="app-admin-title">Guardias</h1>
        <p class="app-admin-subtitle">Administra personal operativo, turnos y visibilidad de cuenta con una presentación más limpia.</p>
      </div>
      <div class="flex justify-start sm:justify-end">
    <button id="btnAddGuardia"
      class="app-admin-primary rounded-full px-5 py-2 text-sm font-semibold">
      + Agregar guardia
    </button>
      </div>
    </div>
  </div>


  <!-- Header columnas (desktop) -->
  <div id="guardiasHeaderColumns"
       class="hidden md:grid grid-cols-12 gap-4 rounded-2xl border border-slate-200 bg-white/70 px-5 py-3 text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-500 shadow-sm">
    <div class="col-span-4">Nombre</div>
    <div class="col-span-5">Contacto</div>
    <div class="col-span-3 text-right">Cuenta</div>
  </div>


  <!-- LISTA -->
  <div id="guardiasList" class="space-y-4 app-mobile-scroll-list"></div>

  <!-- MODAL -->
  <div id="guardiaModal" class="hidden fixed inset-0 z-[999] bg-black/60 backdrop-blur-sm">
    <div class="flex min-h-dvh w-full items-center justify-center p-4 pointer-events-none">
      <div class="flex max-h-[calc(100dvh-2rem)] w-full max-w-md flex-col overflow-hidden rounded-[1.35rem] bg-white shadow-2xl sm:max-h-[min(86dvh,640px)] sm:max-w-lg pointer-events-auto">
        <div class="flex shrink-0 items-start justify-between gap-3 border-b border-slate-100 px-4 py-3">
          <div class="min-w-0">
            <h2 class="text-base font-semibold leading-tight text-slate-900">Nuevo guardia</h2>
            <p class="mt-1 text-xs leading-5 text-slate-500">Registra un nuevo elemento operativo en la caseta.</p>
          </div>
          <button id="btnCloseGuardiaModal" type="button" aria-label="Cerrar formulario"
            class="h-11 w-11 shrink-0 rounded-full bg-slate-100 text-slate-700 transition hover:bg-slate-200 flex items-center justify-center">✕</button>
        </div>

        <form id="guardiaForm" class="flex min-h-0 flex-1 flex-col">
          <div class="flex-1 space-y-4 overflow-y-auto overscroll-contain px-4 py-3">
            <!-- Error dentro del modal -->
            <div id="guardiaModalError" class="hidden rounded-xl bg-rose-100 text-rose-700 px-4 py-3 text-sm"></div>

            <div>
              <label class="mb-1 block text-xs font-medium text-slate-600">Nombre</label>
              <input name="name" required placeholder="Ej. Juan Pérez"
                class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15">
            </div>

            <div>
              <label class="mb-1 block text-xs font-medium text-slate-600">Email</label>
              <input type="email" name="email" required placeholder="Ej. correo@dominio.com"
                class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15">
            </div>

            <div>
              <label class="mb-1 block text-xs font-medium text-slate-600">Teléfono</label>
              <input name="telefono" placeholder="Ej. 5512345678"
                class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15">
            </div>

            <!-- NUEVO: password -->
            <div>
              <label class="mb-1 block text-xs font-medium text-slate-600">Contraseña</label>
              <input type="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres"
                class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15">
              <div class="text-[11px] text-slate-500 mt-1">Mínimo 6 caracteres.</div>
            </div>

            <!-- NUEVO: confirm -->
            <div>
              <label class="mb-1 block text-xs font-medium text-slate-600">Confirmar contraseña</label>
              <input type="password" name="password_confirm" required minlength="6" placeholder="Repite la contraseña"
                class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15">
            </div>
          </div>

          <div class="flex shrink-0 items-center gap-2 border-t border-slate-100 bg-white px-4 py-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))]">
            <button id="btnCancelGuardiaModal" type="button"
              class="min-h-11 rounded-xl border border-slate-200 bg-white px-4 text-sm font-medium text-slate-700 transition hover:bg-slate-50">Cancelar</button>
            <button type="submit"
              class="min-h-11 flex-1 rounded-xl bg-[#2E5D73] px-4 text-sm font-semibold text-white shadow-sm transition hover:opacity-95">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

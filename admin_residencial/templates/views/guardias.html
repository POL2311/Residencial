<div id="guardiasView" class="space-y-5">

  <div id="guardiasAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div class="rounded-[2rem] border border-slate-200/40 bg-white/60 backdrop-blur-xl p-5 shadow-sm">
    <div class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Operación en sitio</div>
    <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-3xl font-semibold text-slate-700">Guardias</h1>
        <p class="mt-1 text-sm text-slate-500">Administra personal operativo, turnos y visibilidad de cuenta con una presentación más limpia.</p>
      </div>
      <div class="flex justify-start sm:justify-end">
    <button id="btnAddGuardia"
      class="shrink-0 rounded-2xl bg-[#2E5D73] px-6 py-3 text-sm font-medium text-white shadow-sm hover:opacity-95">
      + Agregar guardia
    </button>
      </div>
    </div>
  </div>


  <!-- Header columnas (desktop) -->
  <div id="guardiasHeaderColumns"
       class="hidden md:grid grid-cols-12 gap-4 rounded-2xl border border-slate-200 bg-white/70 px-5 py-3 text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-500 shadow-sm">
    <div class="col-span-4">Nombre</div>
    <div class="col-span-5">Contacto</div>
    <div class="col-span-3 text-right">Cuenta</div>
  </div>


  <!-- LISTA -->
  <div id="guardiasList" class="space-y-4 app-mobile-scroll-list"></div>

  <!-- MODAL -->
  <div id="guardiaModal"
    class="fixed inset-0 w-screen h-[100dvh] w-screen h-[100dvh] bg-black/60 backdrop-blur-sm items-end md:items-center justify-center z-50 hidden p-3 md:p-4">
    <div class="flex max-h-[80dvh] w-full max-w-md flex-col overflow-hidden rounded-2xl bg-white shadow-xl">

      <div class="flex justify-between items-center border-b px-4 py-3">
        <h2 class="text-lg font-semibold text-slate-800">Nuevo guardia</h2>
        <button id="btnCloseGuardiaModal" type="button" class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200">✕</button>
      </div>

<form id="guardiaForm" class="flex min-h-0 flex-1 flex-col">
  <div class="flex-1 overflow-y-auto p-4 space-y-4">
  <!-- Error dentro del modal -->
  <div id="guardiaModalError" class="hidden rounded-xl bg-rose-100 text-rose-700 px-4 py-3 text-sm"></div>

  <div>
    <label class="block text-sm font-medium mb-1">Nombre</label>
    <input name="name" required class="w-full rounded-xl border px-3 py-2">
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Email</label>
    <input type="email" name="email" required class="w-full rounded-xl border px-3 py-2">
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Teléfono</label>
    <input name="telefono" class="w-full rounded-xl border px-3 py-2">
  </div>

  <!-- NUEVO: password -->
  <div>
    <label class="block text-sm font-medium mb-1">Contraseña</label>
    <input type="password" name="password" required minlength="6" class="w-full rounded-xl border px-3 py-2">
    <div class="text-[11px] text-slate-500 mt-1">Mínimo 6 caracteres.</div>
  </div>

  <!-- NUEVO: confirm -->
  <div>
    <label class="block text-sm font-medium mb-1">Confirmar contraseña</label>
    <input type="password" name="password_confirm" required minlength="6" class="w-full rounded-xl border px-3 py-2">
  </div>

  </div>
  <div class="border-t border-slate-100 bg-white px-4 py-3 text-right">
    <button type="submit" class="bg-emerald-600 text-white px-5 py-2 rounded-xl">
      Guardar
    </button>
  </div>
</form>

    </div>
  </div>
</div>

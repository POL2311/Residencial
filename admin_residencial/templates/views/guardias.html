<div id="guardiasView" class="space-y-4">

  <div id="guardiasAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div class="flex justify-end">
    <button id="btnAddGuardia"
      class="bg-[#2E5D73] text-white text-sm font-semibold px-5 py-2 rounded-full hover:opacity-90">
      + Agregar guardia
    </button>
  </div>


  <!-- Header columnas -->
  <div class="grid grid-cols-12 gap-3 px-3 py-2 text-[11px] font-semibold uppercase text-slate-500">
    <div class="col-span-4">Nombre</div>
    <div class="col-span-3">Teléfono</div>
    <div class="col-span-2">Servicio</div>
    <div class="col-span-2">Cuenta</div>
    <div class="col-span-1 text-right">Acciones</div>
  </div>


  <!-- LISTA -->
  <div id="guardiasList" class="space-y-4"></div>

  <!-- MODAL -->
  <div id="guardiaModal"
    class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md">

      <div class="flex justify-between items-center border-b px-4 py-3">
        <h2 class="text-lg font-semibold">Nuevo guardia</h2>
        <button id="btnCloseGuardiaModal" class="text-xl font-semibold">✕</button>
      </div>

<form id="guardiaForm" class="p-4 space-y-4">
  <!-- Error dentro del modal -->
  <div id="guardiaModalError" class="hidden rounded-xl bg-rose-100 text-rose-700 px-4 py-3 text-sm"></div>

  <div>
    <label class="block text-sm font-medium mb-1">Nombre</label>
    <input name="name" required class="w-full rounded-xl border px-3 py-2">
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Email</label>
    <input type="email" name="email" required class="w-full rounded-xl border px-3 py-2">
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Teléfono</label>
    <input name="telefono" class="w-full rounded-xl border px-3 py-2">
  </div>

  <!-- NUEVO: password -->
  <div>
    <label class="block text-sm font-medium mb-1">Contraseña</label>
    <input type="password" name="password" required minlength="6" class="w-full rounded-xl border px-3 py-2">
    <div class="text-[11px] text-slate-500 mt-1">Mínimo 6 caracteres.</div>
  </div>

  <!-- NUEVO: confirm -->
  <div>
    <label class="block text-sm font-medium mb-1">Confirmar contraseña</label>
    <input type="password" name="password_confirm" required minlength="6" class="w-full rounded-xl border px-3 py-2">
  </div>

  <div class="text-right pt-2">
    <button type="submit" class="bg-emerald-600 text-white px-5 py-2 rounded-xl">
      Guardar
    </button>
  </div>
</form>

    </div>
  </div>
</div>

<script src="/admin_residencial/js/guardias.js"></script>

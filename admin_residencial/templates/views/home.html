<div id="residentHomeView" class="space-y-6">

  <div id="homeAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <!-- WELCOME -->
  <div class="rounded-[2rem] bg-[#2E5D73] text-white p-6 shadow-lg">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <div class="text-[11px] uppercase tracking-[0.18em] text-white/65">Panel del residencial</div>
        <h1 class="text-3xl font-bold">Bienvenido a tu residencial</h1>
        <p class="text-white/80 mt-1 text-sm">
          Consulta anuncios, servicios y accesos rápidos del condominio.
        </p>
      </div>

      <div class="inline-flex items-center gap-2 rounded-full bg-white/15 px-4 py-2 text-sm">
        <span class="h-2.5 w-2.5 rounded-full bg-emerald-400"></span>
        Sistema activo
      </div>
    </div>
  </div>

  <!-- COMUNICADOS -->
  <section class="space-y-3">
    <div class="flex items-end justify-between">
      <div>
        <h2 class="text-3xl font-semibold text-slate-700">Comunicados</h2>
        <p class="text-sm text-slate-500">Anuncios y avisos destacados del residencial.</p>
      </div>
      <button id="btnVerTodosComunicados" class="text-base text-slate-500 hover:text-slate-700">
        Ver todos
      </button>
    </div>

    <div class="rounded-[2rem] bg-white shadow overflow-hidden border border-slate-200">
      <div class="relative">
        <div id="homeComunicadosSlider" class="overflow-hidden">
          <div id="homeComunicadosTrack" class="flex transition-transform duration-500 ease-in-out"></div>
        </div>

        <button id="homeComPrev"
          class="absolute left-3 top-1/2 -translate-y-1/2 h-10 w-10 rounded-full bg-white/80 hover:bg-white shadow flex items-center justify-center">
          ◀
        </button>

        <button id="homeComNext"
          class="absolute right-3 top-1/2 -translate-y-1/2 h-10 w-10 rounded-full bg-white/80 hover:bg-white shadow flex items-center justify-center">
          ▶
        </button>
      </div>

      <div id="homeComDots" class="py-4 flex items-center justify-center gap-2"></div>
    </div>
  </section>

  <!-- CONTRATA -->
  <section class="space-y-3">
    <div class="flex items-end justify-between">
      <div>
        <h2 class="text-3xl font-semibold text-slate-700">Contrata</h2>
        <p class="text-sm text-slate-500">Servicios y anuncios recomendados dentro del residencial.</p>
      </div>
      <button id="btnVerTodosServicios" class="text-base text-slate-500 hover:text-slate-700">
        Ver todos
      </button>
    </div>

    <div class="relative">
      <button id="homeSrvPrev"
        class="hidden md:flex absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1/2 z-10 h-10 w-10 rounded-full bg-white shadow items-center justify-center border">
        ◀
      </button>

      <div id="homeServiciosScroller" class="flex gap-4 overflow-x-auto pb-2 scroll-smooth"></div>

      <button id="homeSrvNext"
        class="hidden md:flex absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 z-10 h-10 w-10 rounded-full bg-white shadow items-center justify-center border">
        ▶
      </button>
    </div>
  </section>

</div>

<div id="pagosView" class="space-y-4">
  <div id="pagosAlert" class="hidden rounded-lg px-4 py-3 text-sm"></div>

  <div class="flex justify-end">
    <button id="btnAddPago" class="bg-blue-600 text-white text-sm font-semibold px-4 py-2 rounded-md hover:bg-blue-700">+ Registrar pago</button>
  </div>

  <div class="overflow-x-auto">
    <table class="min-w-full text-sm">
      <thead class="text-xs uppercase text-slate-500 bg-slate-100">
        <tr>
          <th class="px-3 py-2">Residente</th>
          <th class="px-3 py-2">Unidad</th>
          <th class="px-3 py-2">Monto</th>
          <th class="px-3 py-2">Fecha</th>
          <th class="px-3 py-2">Método</th>
          <th class="px-3 py-2">Concepto</th>
          <th class="px-3 py-2 text-right">Acciones</th>
        </tr>
      </thead>
      <tbody id="pagosTableBody"></tbody>
    </table>
  </div>

  <!-- Modal Agregar/Editar Pago -->
  <div id="pagoModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md">
      <div class="flex justify-between items-center border-b px-4 py-2">
        <h2 id="pagoModalTitle" class="text-lg font-semibold"></h2>
        <button id="btnClosePagoModal" class="text-xl font-semibold">&times;</button>
      </div>
      <form id="pagoForm" class="px-4 py-3 space-y-3">
        <input type="hidden" name="id" />
        <div>
          <label class="block text-sm font-medium mb-1">Residente</label>
          <select name="user_id" class="w-full border border-slate-300 rounded-md px-2 py-1"></select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Monto ($)</label>
          <input type="number" name="monto" step="0.01" class="w-full border border-slate-300 rounded-md px-3 py-1" required />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Fecha de pago</label>
          <input type="date" name="fecha_pago" class="w-full border border-slate-300 rounded-md px-3 py-1" required />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Método</label>
          <input type="text" name="metodo" class="w-full border border-slate-300 rounded-md px-3 py-1" placeholder="Efectivo, Transferencia, etc." required />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Concepto</label>
          <input type="text" name="concepto" class="w-full border border-slate-300 rounded-md px-3 py-1" placeholder="Ej. Mantenimiento Enero" />
        </div>
        <div class="text-right pt-2">
          <button type="submit" class="bg-green-600 text-white text-sm font-semibold px-4 py-2 rounded-md hover:bg-green-700">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>

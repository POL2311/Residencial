<div id="visitantesRapidosView" class="space-y-4">
  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <div>
        <div class="text-[11px] uppercase tracking-[0.18em] text-slate-400">Accesos rápidos</div>
        <h1 class="mt-1 text-2xl font-semibold text-slate-800">Visitantes rápidos</h1>
        <p class="mt-1 text-sm text-slate-500">Crea accesos ágiles con responsable interno, QR y vigencia controlada.</p>
      </div>
      <button id="btnVisitanteNuevo" type="button" class="rounded-xl bg-[#2E5D73] px-4 py-2 text-sm font-semibold text-white hover:opacity-95">
        + Nuevo acceso
      </button>
    </div>
  </div>

  <div id="visitantesAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>
  <div id="visitantesList" class="space-y-3"></div>

  <div id="visitantesModal" class="app-modal-overlay fixed inset-0 z-50 hidden items-center justify-center bg-black/60">
    <div class="app-modal-card app-admin-modal-card w-full max-w-2xl bg-white shadow-2xl">
      <div class="app-admin-modal-header flex items-center justify-between border-b bg-slate-50 px-4 py-3">
        <h2 id="visitantesModalTitle" class="text-base font-semibold">Nuevo acceso rápido</h2>
        <button id="btnVisitantesClose" type="button" class="h-9 w-9 rounded-full border bg-white hover:bg-slate-100">✕</button>
      </div>
      <form id="visitantesForm" class="flex min-h-0 flex-1 flex-col">
        <div class="app-admin-modal-body space-y-3 px-4 py-4">
          <input type="hidden" name="id" />
          <div id="visitantesFormError" class="hidden rounded-xl bg-rose-100 px-4 py-3 text-sm text-rose-700"></div>

          <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
            <div>
              <label class="mb-1 block text-xs text-slate-600">Nombre visitante</label>
              <input name="nombre_visitante" type="text" class="w-full rounded-xl border px-3 py-2 text-sm" required />
            </div>
            <div>
              <label class="mb-1 block text-xs text-slate-600">Empresa</label>
              <input name="empresa" type="text" class="w-full rounded-xl border px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="mb-1 block text-xs text-slate-600">Responsable interno</label>
              <select name="responsable_user_id" class="w-full rounded-xl border px-3 py-2 text-sm"></select>
            </div>
            <div>
              <label class="mb-1 block text-xs text-slate-600">Área</label>
              <select name="area_id" class="w-full rounded-xl border px-3 py-2 text-sm"></select>
            </div>
            <div>
              <label class="mb-1 block text-xs text-slate-600">Fecha desde</label>
              <input name="fecha_desde" type="date" class="w-full rounded-xl border px-3 py-2 text-sm" required />
            </div>
            <div>
              <label class="mb-1 block text-xs text-slate-600">Fecha hasta</label>
              <input name="fecha_hasta" type="date" class="w-full rounded-xl border px-3 py-2 text-sm" required />
            </div>
          </div>

          <div>
            <label class="mb-1 block text-xs text-slate-600">Placa de auto</label>
            <input name="placa_vehiculo" type="text" class="w-full rounded-xl border px-3 py-2 text-sm" />
          </div>

          <div>
            <label class="mb-1 block text-xs text-slate-600">Motivo</label>
            <textarea name="motivo" rows="3" class="w-full rounded-xl border px-3 py-2 text-sm" required></textarea>
          </div>

          <div>
            <label class="mb-1 block text-xs text-slate-600">Notas admin</label>
            <textarea name="notas_admin" rows="3" class="w-full rounded-xl border px-3 py-2 text-sm"></textarea>
          </div>
        </div>
        <div class="app-admin-modal-footer flex flex-col-reverse gap-2 border-t bg-white px-4 py-3 sm:flex-row sm:justify-end">
          <button id="btnVisitantesCancel" type="button" class="rounded-xl border px-4 py-2 text-sm hover:bg-slate-50">Cancelar</button>
          <button type="submit" class="rounded-xl bg-[#2E5D73] px-4 py-2 text-sm font-semibold text-white hover:opacity-95">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>

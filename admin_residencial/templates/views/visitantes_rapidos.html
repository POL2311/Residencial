<div id="visitantesRapidosView" class="space-y-4">
  <div class="rounded-[1.75rem] border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <div>
        <div class="text-[11px] uppercase tracking-[0.18em] text-slate-400">Accesos rápidos</div>
        <h1 class="mt-1 text-2xl font-semibold text-slate-800">Visitantes rápidos</h1>
        <p class="mt-1 text-sm text-slate-500">Crea accesos ágiles con responsable interno, QR y vigencia controlada.</p>
      </div>
      <button id="btnVisitanteNuevo" type="button" class="rounded-xl bg-[#2E5D73] px-4 py-2.5 text-sm font-semibold text-white hover:opacity-95">
        + Nuevo acceso
      </button>
    </div>
  </div>

  <div id="visitantesAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>
  <div id="visitantesList" class="space-y-3"></div>

  <div id="visitantesModal" class="hidden fixed inset-0 z-[999] bg-black/60 backdrop-blur-sm">
    <div class="flex min-h-dvh w-full items-center justify-center p-4 pointer-events-none">
      <div class="flex max-h-[calc(100dvh-2rem)] w-full max-w-2xl flex-col overflow-hidden rounded-[1.35rem] bg-white shadow-2xl sm:max-h-[min(86dvh,700px)] pointer-events-auto">
        <div class="flex shrink-0 items-start justify-between gap-3 border-b border-slate-100 px-4 py-3">
          <div class="min-w-0">
            <h2 id="visitantesModalTitle" class="text-base font-semibold leading-tight text-slate-900">Nuevo acceso rápido</h2>
            <p class="mt-1 text-xs leading-5 text-slate-500">Registra un nuevo acceso rápido de visita con vigencia temporal.</p>
          </div>
          <button id="btnVisitantesClose" type="button" aria-label="Cerrar formulario"
            class="h-11 w-11 shrink-0 rounded-full bg-slate-100 text-slate-700 transition hover:bg-slate-200 flex items-center justify-center">✕</button>
        </div>
        <form id="visitantesForm" class="flex min-h-0 flex-1 flex-col">
          <div class="flex-1 space-y-4 overflow-y-auto overscroll-contain px-4 py-4">
            <input type="hidden" name="id" />
            <div id="visitantesFormError" class="hidden rounded-xl bg-rose-100 px-4 py-3 text-sm text-rose-700"></div>

            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
              <div>
                <label class="mb-1 block text-xs font-medium text-slate-600">Nombre visitante *</label>
                <input name="nombre_visitante" type="text" placeholder="Ej. Juan Gómez" class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white" required />
              </div>
              <div>
                <label class="mb-1 block text-xs font-medium text-slate-600">Empresa</label>
                <input name="empresa" type="text" placeholder="Ej. Uber, FedEx" class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white" />
              </div>
              <div>
                <label class="mb-1 block text-xs font-medium text-slate-600">Responsable interno</label>
                <select name="responsable_user_id" class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white"></select>
              </div>
              <div>
                <label class="mb-1 block text-xs font-medium text-slate-600">Área</label>
                <select name="area_id" class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white"></select>
              </div>
              <div>
                <label class="mb-1 block text-xs font-medium text-slate-600">Fecha desde *</label>
                <input name="fecha_desde" type="date" class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white" required />
              </div>
              <div>
                <label class="mb-1 block text-xs font-medium text-slate-600">Fecha hasta *</label>
                <input name="fecha_hasta" type="date" class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white" required />
              </div>
            </div>

            <div>
              <label class="mb-1 block text-xs font-medium text-slate-600">Placa de auto</label>
              <input name="placa_vehiculo" type="text" placeholder="Ej. ABC-123-A" class="min-h-11 w-full rounded-xl border border-slate-200 px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white" />
            </div>

            <div>
              <label class="mb-1 block text-xs font-medium text-slate-600">Motivo *</label>
              <textarea name="motivo" rows="3" placeholder="Ej. Entrega de paquetería" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white" required></textarea>
            </div>

            <div>
              <label class="mb-1 block text-xs font-medium text-slate-600">Notas admin</label>
              <textarea name="notas_admin" rows="3" placeholder="Notas internas para el personal de caseta..." class="w-full rounded-xl border border-slate-200 px-3 py-2 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#2E5D73] focus:ring-2 focus:ring-[#2E5D73]/15 bg-white"></textarea>
            </div>
          </div>
          <div class="flex shrink-0 items-center gap-2 border-t border-slate-100 bg-white px-4 py-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))]">
            <button id="btnVisitantesCancel" type="button" class="min-h-11 rounded-xl border border-slate-200 bg-white px-4 text-sm font-medium text-slate-700 transition hover:bg-slate-50">Cancelar</button>
            <button type="submit" class="min-h-11 flex-1 rounded-xl bg-[#2E5D73] px-4 text-sm font-semibold text-white shadow-sm transition hover:opacity-95">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

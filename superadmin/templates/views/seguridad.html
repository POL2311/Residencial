<div id="superadminSeguridadView" class="space-y-4">
  <div id="seguridadAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div>
    <h2 class="text-3xl font-semibold text-slate-700">Seguridad</h2>
    <p class="text-sm text-slate-500">Configura políticas globales de acceso, bloqueo y sesiones.</p>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <form id="seguridadForm" class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <div>
        <label class="mb-1 block text-xs text-slate-600">Máximo de intentos fallidos</label>
        <input name="max_intentos_login" type="number" min="1" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" />
        <p class="mt-1 text-xs text-slate-500">Después de este límite, la cuenta puede bloquearse temporalmente.</p>
      </div>
      <div>
        <label class="mb-1 block text-xs text-slate-600">Minutos de bloqueo</label>
        <input name="minutos_bloqueo_login" type="number" min="0" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" />
        <p class="mt-1 text-xs text-slate-500">Usa 0 para no bloquear de forma automática.</p>
      </div>
      <div>
        <label class="mb-1 block text-xs text-slate-600">Tiempo de sesión (min)</label>
        <input name="tiempo_sesion_minutos" type="number" min="10" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" />
        <p class="mt-1 text-xs text-slate-500">Controla inactividad máxima antes del cierre de sesión.</p>
      </div>
      <div class="flex items-center">
        <label class="flex items-center gap-2 text-sm text-slate-600">
          <input name="registrar_logs_acceso" type="checkbox" value="1">
          Registrar logs de acceso al sistema
        </label>
      </div>
      <div class="md:col-span-2 flex justify-end gap-2">
        <button id="btnRefreshSeguridad" type="button" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Recargar</button>
        <button type="submit" class="rounded-xl bg-[#EF5A5A] px-4 py-2 text-sm text-white shadow hover:opacity-95">Guardar cambios</button>
      </div>
    </form>
  </div>
</div>

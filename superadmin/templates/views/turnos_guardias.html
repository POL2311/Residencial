<div id="superadminTurnosGuardiasView" class="space-y-4">
  <div id="turnosGuardiasAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
    <div>
      <div class="text-[11px] font-semibold uppercase tracking-[0.22em] text-slate-400">Superadmin</div>
      <h2 class="text-3xl font-semibold text-slate-700">Turnos de guardias</h2>
      <p class="text-sm text-slate-500">Consulta y administra los turnos de todos los guardias asignados a servicios.</p>
    </div>
    <button id="btnAddTurnoGuardia" type="button" class="rounded-xl bg-[#4E7287] px-4 py-2 text-sm text-white shadow hover:opacity-95">
      + Nuevo turno
    </button>
  </div>

  <div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="text-sm text-slate-500">Turnos</div>
      <div id="turnosSummaryTotal" class="mt-2 text-3xl font-bold text-slate-900">0</div>
    </div>
    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="text-sm text-slate-500">Activos</div>
      <div id="turnosSummaryActivos" class="mt-2 text-3xl font-bold text-emerald-600">0</div>
    </div>
    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="text-sm text-slate-500">Guardias</div>
      <div id="turnosSummaryGuardias" class="mt-2 text-3xl font-bold text-sky-600">0</div>
    </div>
    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="text-sm text-slate-500">Servicios</div>
      <div id="turnosSummaryServicios" class="mt-2 text-3xl font-bold text-indigo-600">0</div>
    </div>
  </div>

  <div class="rounded-[1.75rem] border border-slate-200 bg-white p-4 shadow-sm">
    <form id="turnosGuardiasFilterForm" class="grid grid-cols-1 gap-3 md:grid-cols-4">
      <div>
        <label class="mb-1 block text-xs text-slate-600">Servicio</label>
        <select id="turnosFilterServicio" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
          <option value="">Todos</option>
        </select>
      </div>
      <div>
        <label class="mb-1 block text-xs text-slate-600">Guardia</label>
        <select id="turnosFilterGuardia" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
          <option value="">Todos</option>
        </select>
      </div>
      <div>
        <label class="mb-1 block text-xs text-slate-600">Estatus</label>
        <select id="turnosFilterActivo" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
          <option value="">Todos</option>
          <option value="1">Activos</option>
          <option value="0">Inactivos</option>
        </select>
      </div>
      <div>
        <label class="mb-1 block text-xs text-slate-600">Buscar</label>
        <input id="turnosFilterQ" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="Guardia, correo, servicio o turno..." />
      </div>
      <div class="md:col-span-4 flex justify-end gap-2">
        <button id="btnResetTurnosFilters" type="button" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Limpiar</button>
        <button type="submit" class="rounded-xl bg-[#4E7287] px-4 py-2 text-sm text-white shadow hover:opacity-95">Filtrar</button>
      </div>
    </form>
  </div>

  <div class="rounded-[1.75rem] border border-slate-200 bg-white p-4 shadow-sm">
    <div class="flex items-center justify-between gap-3">
      <div>
        <div class="text-[11px] font-semibold uppercase tracking-[0.22em] text-slate-400">Directorio</div>
        <div class="mt-1 text-sm font-semibold text-slate-700">Turnos registrados</div>
        <div class="mt-1 text-xs text-slate-500">Vista global de horarios, guardias asignados y estado de activación.</div>
      </div>
      <button id="btnRefreshTurnosGuardias" type="button" class="rounded-lg border px-3 py-2 text-sm text-slate-600 hover:bg-slate-50">Refrescar</button>
    </div>
    <div id="turnosGuardiasList" class="mt-4 space-y-3"></div>
    <div id="turnosGuardiasPagination" class="mt-4"></div>
  </div>

  <div id="turnoGuardiaModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm">
    <div class="min-h-full flex items-end md:items-center justify-center p-0 md:p-4">
      <div class="flex max-h-[92vh] w-full max-w-xl flex-col overflow-hidden rounded-t-2xl bg-white shadow-2xl md:rounded-2xl">
        <div class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-100 bg-white px-4 py-3">
          <div id="turnoGuardiaModalTitle" class="text-sm font-semibold text-slate-800">Nuevo turno</div>
          <button id="btnCloseTurnoGuardiaModal" type="button" class="h-9 w-9 rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200">✕</button>
        </div>
        <form id="turnoGuardiaForm" class="flex min-h-0 flex-1 flex-col">
          <div class="flex-1 overflow-y-auto p-4 space-y-4">
            <div id="turnoGuardiaFormError" class="hidden rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700"></div>
            <input type="hidden" name="turno_id" />
            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
              <div>
                <label class="mb-1 block text-xs text-slate-600">Servicio *</label>
                <select name="residencial_id" id="turnoGuardiaServiceSelect" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" required></select>
              </div>
              <div>
                <label class="mb-1 block text-xs text-slate-600">Guardia *</label>
                <select name="guardia_id" id="turnoGuardiaUserSelect" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" required></select>
              </div>
              <div class="md:col-span-2">
                <label class="mb-1 block text-xs text-slate-600">Nombre del turno *</label>
                <input name="nombre_turno" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="Ej. Vespertino" required />
              </div>
              <div>
                <label class="mb-1 block text-xs text-slate-600">Hora inicio *</label>
                <input type="time" name="hora_inicio" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" required />
              </div>
              <div>
                <label class="mb-1 block text-xs text-slate-600">Hora fin *</label>
                <input type="time" name="hora_fin" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" required />
              </div>
              <div class="md:col-span-2">
                <label class="mb-1 block text-xs text-slate-600">Días *</label>
                <input name="dias_semana" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="LUN,MAR,MIE,JUE,VIE" required />
              </div>
            </div>
            <label class="flex items-center gap-2 text-sm text-slate-600">
              <input type="checkbox" name="activo" value="1" class="h-4 w-4 rounded border-slate-300" />
              Dejar este turno como activo
            </label>
          </div>
          <div class="border-t border-slate-100 bg-white px-4 py-3 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
            <button type="button" id="btnCancelTurnoGuardiaModal" class="rounded-xl border border-slate-200 px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Cancelar</button>
            <button type="submit" class="rounded-xl bg-[#4E7287] px-4 py-2 text-sm text-white shadow hover:opacity-95">Guardar turno</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="turnoGuardiaExceptionModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm">
    <div class="min-h-full flex items-end md:items-center justify-center p-0 md:p-4">
      <div class="flex max-h-[92vh] w-full max-w-3xl flex-col overflow-hidden rounded-t-2xl bg-white shadow-2xl md:rounded-2xl">
        <div class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-100 bg-white px-4 py-3">
          <div>
            <div id="turnoGuardiaExceptionModalTitle" class="text-sm font-semibold text-slate-800">Excepciones del guardia</div>
            <div id="turnoGuardiaExceptionModalSubtitle" class="mt-1 text-xs text-slate-500"></div>
          </div>
          <button id="btnCloseTurnoGuardiaExceptionModal" type="button" class="h-9 w-9 rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200">✕</button>
        </div>
        <div class="flex min-h-0 flex-1 flex-col">
          <div class="flex-1 overflow-y-auto p-4 space-y-4">
            <div id="turnoGuardiaExceptionFormError" class="hidden rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700"></div>
            <form id="turnoGuardiaExceptionForm" class="space-y-4 rounded-2xl border border-slate-200 bg-slate-50 p-4">
              <input type="hidden" name="exception_id" />
              <input type="hidden" name="residencial_id" />
              <input type="hidden" name="guardia_id" />
              <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                <div>
                  <label class="mb-1 block text-xs text-slate-600">Fecha inicio *</label>
                  <input type="date" name="fecha_inicio" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" required />
                </div>
                <div>
                  <label class="mb-1 block text-xs text-slate-600">Fecha fin *</label>
                  <input type="date" name="fecha_fin" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" required />
                </div>
                <div class="md:col-span-2">
                  <label class="mb-1 block text-xs text-slate-600">Motivo *</label>
                  <input name="motivo" maxlength="120" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="Ej. Permiso, incapacidad, ausencia" required />
                </div>
                <div class="md:col-span-2">
                  <label class="mb-1 block text-xs text-slate-600">Notas</label>
                  <textarea name="notas" rows="3" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="Opcional"></textarea>
                </div>
              </div>
              <label class="flex items-center gap-2 text-sm text-slate-600">
                <input type="checkbox" name="activo" value="1" class="h-4 w-4 rounded border-slate-300" />
                Dejar esta excepción como activa
              </label>
              <div class="flex flex-col gap-2 sm:flex-row sm:justify-end">
                <button type="button" id="btnResetTurnoGuardiaExceptionForm" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Limpiar</button>
                <button type="submit" class="rounded-xl bg-amber-600 px-4 py-2 text-sm text-white shadow hover:opacity-95">Guardar excepción</button>
              </div>
            </form>

            <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
              <div class="grid grid-cols-1 gap-3 md:grid-cols-3">
                <div>
                  <label class="mb-1 block text-xs text-slate-600">Periodo</label>
                  <select id="turnoGuardiaExceptionFilterPeriod" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
                    <option value="">Todas</option>
                    <option value="today">Hoy</option>
                    <option value="upcoming">Próximas</option>
                    <option value="past">Históricas</option>
                  </select>
                </div>
                <div>
                  <label class="mb-1 block text-xs text-slate-600">Estatus</label>
                  <select id="turnoGuardiaExceptionFilterActive" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
                    <option value="">Todas</option>
                    <option value="1">Activas</option>
                    <option value="0">Inactivas</option>
                  </select>
                </div>
                <div class="flex items-end justify-end">
                  <button type="button" id="btnRefreshTurnoGuardiaExceptions" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Refrescar</button>
                </div>
              </div>
              <div id="turnoGuardiaExceptionList" class="mt-4 space-y-3"></div>
            </div>
          </div>
          <div class="border-t border-slate-100 bg-white px-4 py-3 flex justify-end">
            <button type="button" id="btnCancelTurnoGuardiaExceptionModal" class="rounded-xl border border-slate-200 px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

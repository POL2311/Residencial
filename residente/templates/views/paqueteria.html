<div id="paqueteriaView" class="space-y-4">

  <div id="paqAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div class="flex flex-col gap-2">
    <h2 class="text-3xl font-semibold text-slate-700">Paquetería</h2>
  </div>

  <div class="rounded-2xl bg-white shadow overflow-hidden">
    <div class="px-4 py-4 flex items-start justify-between gap-3">
      <div class="min-w-0">
        <div class="text-xs text-slate-500">
          <span id="paqCasetaWrap" class="hidden">
            Caseta: <a id="paqCasetaTel" class="inline-flex min-h-11 items-center rounded-full px-2 font-medium text-[#2E5D73] underline" href="#">Llamar</a>
          </span>
        </div>
      </div>

      <button id="btnRefreshPaq" type="button"
        class="min-h-11 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-600 hover:bg-slate-50">
        Refrescar
      </button>
    </div>

    <div class="px-4 pb-4 flex flex-wrap gap-2">
      <button class="paqFilter min-h-11 px-4 py-2 rounded-full text-xs border border-slate-200 bg-slate-50 text-slate-700"
              data-filter="todos">Todos</button>
      <button class="paqFilter min-h-11 px-4 py-2 rounded-full text-xs border border-slate-200 bg-white text-slate-700"
              data-filter="registrado">Pendientes</button>
      <button class="paqFilter min-h-11 px-4 py-2 rounded-full text-xs border border-slate-200 bg-white text-slate-700"
              data-filter="entregado">Entregados</button>
      <button class="paqFilter min-h-11 px-4 py-2 rounded-full text-xs border border-slate-200 bg-white text-slate-700"
              data-filter="devuelto">Devueltos</button>
    </div>

    <div id="paqEmpty" class="hidden p-4">
      <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-600">
        Aún no hay paquetes registrados para tu unidad.
      </div>
    </div>

    <div id="paqList" class="divide-y divide-slate-100"></div>
  </div>

  <div id="paqModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm">
    <div class="box-border flex h-full items-end justify-center px-3 pb-[max(12px,env(safe-area-inset-bottom))] pt-3 sm:items-center sm:p-4">
      <div class="flex max-h-[min(86dvh,640px)] w-full max-w-md flex-col overflow-hidden rounded-[1.35rem] bg-white shadow-2xl sm:max-w-lg">
        <div class="flex items-start justify-between gap-3 border-b border-slate-100 px-4 py-3">
          <div class="min-w-0">
            <div id="paqModalTitle" class="text-base font-semibold leading-tight text-slate-900">—</div>
            <p class="mt-1 text-xs leading-5 text-slate-500">Revisa el detalle y confirma solo la acción necesaria.</p>
          </div>
          <button id="btnClosePaqModal" type="button"
                  aria-label="Cerrar paquetería"
                  class="h-11 w-11 shrink-0 rounded-full bg-slate-100 text-slate-700 transition hover:bg-slate-200">✕</button>
        </div>

        <form id="paqModalForm" class="flex min-h-0 flex-1 flex-col" onsubmit="event.preventDefault();">
          <input type="hidden" id="paqModalAction" name="action" value="">
          <div id="paqModalBody" class="flex-1 space-y-3 overflow-y-auto overscroll-contain px-4 py-3"></div>

          <div class="flex shrink-0 items-center gap-2 border-t border-slate-100 bg-white px-4 py-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))]">
            <button id="btnCancelPaqModal" type="button"
                    class="min-h-11 rounded-xl border border-slate-200 bg-white px-4 text-sm font-medium text-slate-700 transition hover:bg-slate-50">
              Cancelar
            </button>
            <button id="btnSavePaqModal" type="submit"
                    class="min-h-11 flex-1 rounded-xl bg-[#2E5D73] px-4 text-sm font-semibold text-white shadow-sm transition hover:opacity-95">
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

</div>

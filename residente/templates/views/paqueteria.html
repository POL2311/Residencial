<div id="paqueteriaView" class="space-y-3">

  <!-- Alertas -->
  <div id="paqAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <!-- Header de sección -->
  <div class="rounded-2xl bg-white shadow overflow-hidden">
    <div class="px-4 py-4 flex items-start justify-between gap-3">
      <div class="min-w-0">
        <div class="text-base font-semibold text-slate-800">Paquetería</div>
        <div class="text-xs text-slate-500">
          Registra paquetes esperados y confirma al recibir.
          <span id="paqCasetaWrap" class="hidden">
            · Caseta: <a id="paqCasetaTel" class="text-[#2E5D73] font-medium underline" href="#">Llamar</a>
          </span>
        </div>
      </div>

      <button id="btnPaqCreate" type="button"
              class="shrink-0 text-xs px-3 py-2 rounded-full bg-[#2E5D73] text-white hover:opacity-95">
        Registrar paquete
      </button>
    </div>

    <!-- Filtros -->
    <div class="px-4 pb-4 flex flex-wrap gap-2">
      <button class="paqFilter px-3 py-1.5 rounded-full text-xs border border-slate-200 bg-slate-50 text-slate-700"
              data-filter="todos">Todos</button>
      <button class="paqFilter px-3 py-1.5 rounded-full text-xs border border-slate-200 bg-white text-slate-700"
              data-filter="esperado">Esperado</button>
      <button class="paqFilter px-3 py-1.5 rounded-full text-xs border border-slate-200 bg-white text-slate-700"
              data-filter="registrado">En caseta</button>
      <button class="paqFilter px-3 py-1.5 rounded-full text-xs border border-slate-200 bg-white text-slate-700"
              data-filter="acceso_otorgado">Acceso otorgado</button>
      <button class="paqFilter px-3 py-1.5 rounded-full text-xs border border-slate-200 bg-white text-slate-700"
              data-filter="finalizados">Finalizados</button>
    </div>
  </div>

  <!-- Lista -->
  <div class="rounded-2xl bg-white shadow overflow-hidden">
    <div id="paqEmpty" class="hidden p-4">
      <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-600">
        Aún no hay paquetes registrados. Presiona <b>Registrar paquete</b>.
      </div>
    </div>

    <div id="paqList" class="divide-y divide-slate-100"></div>
  </div>

  <!-- MODAL -->
  <div id="paqModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm">
    <div class="min-h-full flex items-end md:items-center justify-center p-0 md:p-4">
      <div class="w-full md:max-w-lg bg-white md:rounded-2xl rounded-t-2xl shadow-2xl overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
          <div id="paqModalTitle" class="text-sm font-semibold text-slate-800">—</div>
          <button id="btnClosePaqModal" type="button"
                  class="h-9 w-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700">✕</button>
        </div>

        <form id="paqModalForm" class="p-4 space-y-3" enctype="multipart/form-data">
          <input type="hidden" id="paqModalAction" name="action" value="">
          <div id="paqModalBody" class="space-y-3"></div>

          <div class="pt-1 flex justify-end gap-2">
            <button id="btnCancelPaqModal" type="button"
                    class="text-sm px-4 py-2 rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50">
              Cancelar
            </button>
            <button id="btnSavePaqModal" type="submit"
                    class="text-sm px-4 py-2 rounded-xl bg-[#2E5D73] text-white hover:opacity-95">
              Guardar
            </button>
          </div>
        </form>

        <div class="h-2 md:hidden"></div>
      </div>
    </div>
  </div>

</div>

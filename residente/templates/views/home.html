<div id="residentHomeView" class="space-y-6">
  <section class="rounded-[1.5rem] border border-slate-200 bg-white px-4 py-5 shadow-sm sm:rounded-[2rem] sm:px-5 sm:py-6">
    <div class="app-admin-kicker">Centro del residente</div>
    <h1 class="app-admin-title">Tu residencial, en una sola vista</h1>
    <p class="app-admin-subtitle">Consulta avisos vigentes, servicios útiles y accesos frecuentes con una navegación más clara y ligera.</p>
    <div class="mt-5 flex flex-wrap gap-3">
      <button type="button" data-home-nav="comunicados" class="app-admin-primary min-h-11 rounded-full px-5 py-2.5 text-sm font-medium">
        Ver comunicados
      </button>
      <button type="button" data-home-nav="servicios" class="app-admin-ghost min-h-11 rounded-full px-5 py-2.5 text-sm font-medium">
        Explorar servicios
      </button>
    </div>
  </section>

  <div id="homeAlert"
       class="hidden rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800"></div>

  <!-- COMUNICADOS -->
  <section class="space-y-3">
    <div class="flex items-end justify-between gap-3">
      <div>
        <div class="text-[11px] font-semibold uppercase tracking-[0.22em] text-slate-400">Comunicados</div>
        <h2 class="mt-1 text-2xl font-semibold text-slate-700">Anuncios destacados</h2>
      </div>
      <button type="button" data-home-nav="comunicados"
        class="app-admin-ghost min-h-11 rounded-full px-4 py-2 text-sm font-medium">
        Ver todos
      </button>
    </div>

    <div class="overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-sm">
      <div id="residentHomeComSlider" class="relative">
        <div class="overflow-hidden">
          <div id="residentHomeComTrack" class="flex transition-transform duration-500 ease-in-out"></div>
        </div>

        <button id="residentHomeComPrev" type="button"
          class="absolute left-3 top-1/2 z-10 hidden h-11 w-11 -translate-y-1/2 rounded-full border border-slate-200 bg-white/90 text-slate-700 shadow md:flex items-center justify-center">
          ◀
        </button>

        <button id="residentHomeComNext" type="button"
          class="absolute right-3 top-1/2 z-10 hidden h-11 w-11 -translate-y-1/2 rounded-full border border-slate-200 bg-white/90 text-slate-700 shadow md:flex items-center justify-center">
          ▶
        </button>
      </div>

      <div id="residentHomeComDots" class="py-4 flex items-center justify-center gap-2"></div>
    </div>
  </section>

  <section class="space-y-3">
    <div class="flex items-end justify-between gap-3">
      <div>
        <div class="text-[11px] font-semibold uppercase tracking-[0.22em] text-slate-400">Servicios</div>
        <h2 class="mt-1 text-2xl font-semibold text-slate-700">Servicios destacados</h2>
      </div>
      <button type="button" data-home-nav="servicios"
        class="app-admin-ghost min-h-11 rounded-full px-4 py-2 text-sm font-medium">
        Ver todos
      </button>
    </div>

    <div class="relative">
      <button id="homeSrvPrev"
        class="absolute left-3 top-1/2 z-10 hidden h-11 w-11 -translate-y-1/2 rounded-full border bg-white shadow md:flex items-center justify-center">
        ◀
      </button>

      <div id="homeServices" class="flex gap-4 overflow-x-auto pb-2 scroll-smooth"></div>

      <button id="homeSrvNext"
        class="absolute right-3 top-1/2 z-10 hidden h-11 w-11 -translate-y-1/2 rounded-full border bg-white shadow md:flex items-center justify-center">
        ▶
      </button>
    </div>
  </section>

  <div id="residentTipsModal" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm">
    <div class="box-border flex h-full items-end justify-center px-3 pb-[max(12px,env(safe-area-inset-bottom))] pt-3 sm:items-center sm:p-4">
      <div class="flex max-h-[min(86dvh,640px)] w-full max-w-md flex-col overflow-hidden rounded-[1.35rem] bg-white shadow-2xl">
        <div class="flex items-start justify-between gap-3 border-b border-slate-100 px-4 py-3">
          <div class="min-w-0">
            <div class="text-base font-semibold leading-tight text-slate-900">Consejos útiles</div>
            <p class="mt-1 text-xs leading-5 text-slate-500">Te los mostraremos solo una vez por día.</p>
          </div>
          <button id="btnCloseResidentTipsModal" type="button"
            aria-label="Cerrar consejos"
            class="h-11 w-11 shrink-0 rounded-full bg-slate-100 text-slate-700 transition hover:bg-slate-200">
            ✕
          </button>
        </div>
        <div id="residentTipsModalBody" class="flex-1 space-y-3 overflow-y-auto overscroll-contain px-4 py-3"></div>
        <div class="flex shrink-0 justify-end border-t border-slate-100 bg-white px-4 py-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))]">
          <button id="btnDismissResidentTipsModal" type="button"
            class="min-h-11 rounded-xl bg-[#2E5D73] px-5 text-sm font-semibold text-white shadow-sm transition hover:opacity-95">
            Entendido
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

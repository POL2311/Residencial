<div id="residentHomeView" class="space-y-6">

  <div id="homeAlert"
       class="hidden rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800"></div>

  <section class="rounded-[2rem] bg-gradient-to-r from-[#26495B] via-[#3F677C] to-[#6E8EA0] p-6 text-white shadow-lg">
    <div class="flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
      <div class="max-w-2xl">
        <h1 class="text-3xl font-semibold leading-tight">Hola, <span id="residentQuickName">Residente</span></h1>
        <p id="homeUnitLabel" class="mt-2 text-sm text-white/85">Cargando contexto...</p>
      </div>

      <div class="grid grid-cols-2 gap-3 lg:w-[360px]">
        <button type="button" data-home-nav="paqueteria"
          class="rounded-2xl bg-white/15 px-4 py-3 text-left backdrop-blur transition hover:bg-white/20">
          <div class="text-xs text-white/70">Acción rápida</div>
          <div class="mt-1 text-sm font-semibold">Revisar paquetería</div>
        </button>

        <button type="button" data-home-nav="perfil"
          class="rounded-2xl bg-white/15 px-4 py-3 text-left backdrop-blur transition hover:bg-white/20">
          <div class="text-xs text-white/70">Acción rápida</div>
          <div class="mt-1 text-sm font-semibold">Actualizar perfil</div>
        </button>

        <button type="button" data-home-nav="visitas"
          class="rounded-2xl bg-white/15 px-4 py-3 text-left backdrop-blur transition hover:bg-white/20">
          <div class="text-xs text-white/70">Acción rápida</div>
          <div class="mt-1 text-sm font-semibold">Registrar visita</div>
        </button>

        <button type="button" data-home-nav="incidencias"
          class="rounded-2xl bg-white/15 px-4 py-3 text-left backdrop-blur transition hover:bg-white/20">
          <div class="text-xs text-white/70">Acción rápida</div>
          <div class="mt-1 text-sm font-semibold">Reportar incidencia</div>
        </button>
      </div>
    </div>
  </section>

  <section class="space-y-3">
    <div class="flex items-end justify-between gap-3">
      <div>
        <h2 class="text-3xl font-semibold text-slate-700">Servicios destacados</h2>
        <p class="text-sm text-slate-500">Opciones recomendadas y contactos útiles dentro del residencial.</p>
      </div>
      <button type="button" data-home-nav="comunicados"
        class="rounded-full border border-slate-200 bg-white px-4 py-2 text-sm text-slate-600 shadow-sm hover:bg-slate-50">
        Más información
      </button>
    </div>

    <div class="relative">
      <button id="homeSrvPrev"
        class="absolute left-0 top-1/2 z-10 hidden h-10 w-10 -translate-x-1/2 -translate-y-1/2 rounded-full border bg-white shadow md:flex items-center justify-center">
        ◀
      </button>

      <div id="homeServices" class="flex gap-4 overflow-x-auto pb-2 scroll-smooth"></div>

      <button id="homeSrvNext"
        class="absolute right-0 top-1/2 z-10 hidden h-10 w-10 translate-x-1/2 -translate-y-1/2 rounded-full border bg-white shadow md:flex items-center justify-center">
        ▶
      </button>
    </div>
  </section>

  <section class="space-y-3">
    <div class="flex items-end justify-between gap-3">
      <div>
        <h2 class="text-3xl font-semibold text-slate-700">Comunicados</h2>
        <p class="text-sm text-slate-500">Avisos y anuncios importantes para tu residencial.</p>
      </div>
      <button type="button" data-home-nav="comunicados"
        class="rounded-full border border-slate-200 bg-white px-4 py-2 text-sm text-slate-600 shadow-sm hover:bg-slate-50">
        Ver todos
      </button>
    </div>

    <div class="rounded-3xl border border-slate-200 bg-white shadow-sm overflow-hidden">
      <div class="relative">
        <div id="homeAnnouncementsSlider" class="overflow-hidden">
          <div id="homeAnnouncementsTrack" class="flex transition-transform duration-500 ease-in-out"></div>
        </div>

        <button id="homeAnnPrev"
          class="absolute left-3 top-1/2 hidden h-10 w-10 -translate-y-1/2 rounded-full bg-white/85 shadow md:flex items-center justify-center">
          ◀
        </button>

        <button id="homeAnnNext"
          class="absolute right-3 top-1/2 hidden h-10 w-10 -translate-y-1/2 rounded-full bg-white/85 shadow md:flex items-center justify-center">
          ▶
        </button>
      </div>

      <div id="homeAnnouncementDots" class="flex items-center justify-center gap-2 py-4"></div>
    </div>
  </section>

  <div id="residentTipsModal" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm">
    <div class="flex min-h-full items-end justify-center p-0 sm:items-center sm:p-4">
      <div class="flex max-h-[88vh] w-full flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl sm:max-w-lg sm:rounded-3xl">
        <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
          <div>
            <div class="text-lg font-semibold text-slate-800">Consejos útiles</div>
            <p class="mt-1 text-sm text-slate-500">Te los mostraremos solo una vez por día.</p>
          </div>
          <button id="btnCloseResidentTipsModal" type="button"
            class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200">
            ✕
          </button>
        </div>
        <div id="residentTipsModalBody" class="flex-1 space-y-3 overflow-y-auto px-5 py-4"></div>
        <div class="border-t border-slate-100 bg-white px-5 py-4">
          <button id="btnDismissResidentTipsModal" type="button"
            class="w-full rounded-2xl bg-[#2E5D73] px-4 py-3 text-sm font-medium text-white hover:opacity-95">
            Entendido
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

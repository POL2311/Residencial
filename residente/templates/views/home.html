<div id="residentHomeView" class="space-y-8">
  <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <!-- Lado A: Estado de cuenta -->
    <div class="rounded-[2rem] border border-slate-200/40 bg-white/60 backdrop-blur-xl px-6 py-6 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between">
      <div>
        <div class="flex items-center justify-between">
          <div class="text-[11px] font-bold uppercase tracking-[0.2em] text-slate-400">Estado de cuenta</div>
          <div class="h-8 w-8 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-500">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h16v10H4V7Z"/>
              <path d="M7 12h5"/>
              <path d="M16 10.5a1.5 1.5 0 1 0 0 3"/>
            </svg>
          </div>
        </div>
        <div class="mt-4">
          <div class="text-3xl font-bold text-slate-800 tracking-tight">$0.00</div>
          <div class="mt-1 flex items-center gap-1.5 text-sm font-medium text-emerald-600">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            Al día
          </div>
        </div>
      </div>
      <div class="mt-6">
        <button type="button" data-home-nav="pagos" class="w-full inline-flex items-center justify-center rounded-2xl bg-slate-900 px-4 py-3 text-sm font-medium text-white transition-all hover:bg-slate-800 active:scale-[0.98]">
          Ver detalles
        </button>
      </div>
    </div>

    <!-- Lado B: Acceso Rápido -->
    <div class="rounded-[2rem] border border-slate-200/40 bg-gradient-to-br from-white/80 to-slate-50/50 backdrop-blur-xl px-6 py-6 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between">
      <div>
        <div class="flex items-center justify-between">
          <div class="text-[11px] font-bold uppercase tracking-[0.2em] text-[#2E5D73]/70">Acceso Rápido</div>
          <div class="h-8 w-8 rounded-full bg-[#2E5D73]/10 flex items-center justify-center text-[#2E5D73]">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <rect x="7" y="7" width="3" height="3"></rect>
              <rect x="14" y="7" width="3" height="3"></rect>
              <rect x="7" y="14" width="3" height="3"></rect>
              <rect x="14" y="14" width="3" height="3"></rect>
            </svg>
          </div>
        </div>
        <div class="mt-4">
          <h2 class="text-xl font-bold text-slate-800">Generar código QR</h2>
          <p class="mt-1 text-sm text-slate-500">Acceso rápido para ti o tus visitas frecuentes.</p>
        </div>
      </div>
      <div class="mt-6">
        <button type="button" data-home-nav="visitas" class="w-full inline-flex items-center justify-center rounded-2xl bg-[#2E5D73] px-4 py-3 text-sm font-medium text-white shadow-lg shadow-[#2E5D73]/20 transition-all hover:bg-[#254b5c] active:scale-[0.98]">
          Crear acceso
        </button>
      </div>
    </div>
  </section>

  <div id="homeAlert"
       class="hidden rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800"></div>

  <div id="residentTipsBanner" class="hidden rounded-3xl border border-slate-200/40 bg-slate-50 px-5 py-4">
    <div class="flex items-start justify-between gap-4">
      <div class="flex-1">
        <div class="flex items-center gap-2">
          <svg class="h-4 w-4 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
          <div class="text-sm font-semibold text-slate-800">Consejos útiles</div>
        </div>
        <div id="residentTipsBannerBody" class="mt-2 text-sm text-slate-600"></div>
      </div>
      <button id="btnDismissResidentTipsBanner" type="button" class="shrink-0 h-8 w-8 rounded-full bg-slate-200/50 flex items-center justify-center text-slate-500 hover:bg-slate-200 hover:text-slate-700 transition-colors">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>

  <!-- COMUNICADOS -->
  <section class="space-y-3">
    <div class="flex items-end justify-between gap-3">
      <div>
        <div class="text-[11px] font-semibold uppercase tracking-[0.22em] text-slate-400">Comunicados</div>
        <h2 class="mt-1 text-2xl font-semibold text-slate-700">Anuncios destacados</h2>
      </div>
      <button type="button" data-home-nav="comunicados"
        class="app-admin-ghost rounded-full px-4 py-2 text-sm font-medium">
        Ver todos
      </button>
    </div>

    <div class="overflow-hidden rounded-[2rem] border border-slate-200/40 bg-white shadow-sm">
      <div id="residentHomeComSlider" class="relative">
        <div class="overflow-hidden">
          <div id="residentHomeComTrack" class="flex transition-transform duration-500 ease-in-out"></div>
        </div>

        <button id="residentHomeComPrev" type="button"
          class="absolute left-3 top-1/2 z-10 hidden h-10 w-10 -translate-y-1/2 rounded-full border border-slate-200 bg-white/90 text-slate-700 shadow md:flex items-center justify-center">
          ◀
        </button>

        <button id="residentHomeComNext" type="button"
          class="absolute right-3 top-1/2 z-10 hidden h-10 w-10 -translate-y-1/2 rounded-full border border-slate-200 bg-white/90 text-slate-700 shadow md:flex items-center justify-center">
          ▶
        </button>
      </div>

      <div id="residentHomeComDots" class="py-4 flex items-center justify-center gap-2"></div>
    </div>
  </section>

  <section class="space-y-3">
    <div class="flex items-end justify-between gap-3">
      <div>
        <div class="text-[11px] font-semibold uppercase tracking-[0.22em] text-slate-400">Servicios</div>
        <h2 class="mt-1 text-2xl font-semibold text-slate-700">Servicios destacados</h2>
      </div>
      <button type="button" data-home-nav="servicios"
        class="app-admin-ghost rounded-full px-4 py-2 text-sm font-medium">
        Ver todos
      </button>
    </div>

    <div class="relative">
      <button id="homeSrvPrev"
        class="absolute left-0 top-1/2 z-10 hidden h-10 w-10 -translate-x-1/2 -translate-y-1/2 rounded-full border bg-white shadow md:flex items-center justify-center">
        ◀
      </button>

      <div id="homeServices" class="flex gap-4 overflow-x-auto pb-2 scroll-smooth"></div>

      <button id="homeSrvNext"
        class="absolute right-0 top-1/2 z-10 hidden h-10 w-10 translate-x-1/2 -translate-y-1/2 rounded-full border bg-white shadow md:flex items-center justify-center">
        ▶
      </button>
    </div>
  </section>

</div>

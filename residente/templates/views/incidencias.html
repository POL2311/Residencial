<div id="residentIncidenciasView" class="space-y-4">
  <div id="incidenciasAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
    <div>
      <h2 class="text-3xl font-semibold text-slate-700">Incidencias</h2>
      <p class="text-sm text-slate-500">Reporta y consulta incidencias relacionadas con tu unidad.</p>
    </div>
    <button id="btnNuevaIncidenciaResident" type="button"
      class="rounded-xl bg-[#EF5A5A] px-4 py-2 text-sm text-white shadow hover:opacity-95">
      + Reportar incidencia
    </button>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="text-sm font-semibold text-slate-700">Historial de incidencias</div>
    <div class="mt-1 text-xs text-slate-500">Da seguimiento al estado de tus reportes.</div>
    <div id="residentIncidenciasList" class="mt-4 space-y-3"></div>
  </div>

  <div id="residentIncidenciasModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm">
    <div class="min-h-full flex items-end md:items-center justify-center p-0 md:p-4">
      <div class="w-full md:max-w-lg bg-white md:rounded-2xl rounded-t-2xl shadow-2xl overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
          <div class="text-sm font-semibold text-slate-800">Nueva incidencia</div>
          <button id="btnCloseResidentIncModal" type="button" class="h-9 w-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700">✕</button>
        </div>
        <form id="residentIncidenciasForm" class="p-4 space-y-3">
          <div>
            <label class="block text-xs text-slate-600 mb-1">Tipo</label>
            <select name="tipo" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
              <option value="seguridad">Seguridad</option>
              <option value="ruido">Ruido</option>
              <option value="mantenimiento">Mantenimiento</option>
              <option value="otros">Otros</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-600 mb-1">Titulo</label>
            <input name="titulo" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" required>
          </div>
          <div>
            <label class="block text-xs text-slate-600 mb-1">Prioridad</label>
            <select name="prioridad" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
              <option value="baja">Baja</option>
              <option value="media" selected>Media</option>
              <option value="alta">Alta</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-600 mb-1">Descripcion</label>
            <textarea name="descripcion" rows="4" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" required></textarea>
          </div>
          <div class="pt-1 flex justify-end gap-2">
            <button id="btnCancelResidentIncModal" type="button" class="text-sm px-4 py-2 rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50">Cancelar</button>
            <button type="submit" class="text-sm px-4 py-2 rounded-xl bg-[#EF5A5A] text-white hover:opacity-95">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div id="residentIncidenciasView" class="space-y-4">
  <div id="incidenciasAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
    <div>
      <h2 class="text-3xl font-semibold text-slate-700">Incidencias</h2>
    </div>
    <button id="btnNuevaIncidenciaResident" type="button"
      class="rounded-xl bg-[#EF5A5A] px-4 py-2 text-sm text-white shadow hover:opacity-95">
      + Reportar incidencia
    </button>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="text-sm font-semibold text-slate-700">Historial de incidencias</div>
    <div id="residentIncidenciasList" class="mt-4 space-y-3"></div>
  </div>

  <div id="residentIncidenciasModal" class="os-modal-v2 hidden z-50">
    <div class="os-modal-v2__backdrop" data-close-modal></div>
    <section class="os-modal-v2__panel os-modal-v2__panel--form os-modal-v2__panel--full-mobile" role="dialog" aria-modal="true" aria-labelledby="residentIncidenciasModalTitle">
      <header class="os-modal-v2__header">
        <div>
          <div class="os-modal-v2__eyebrow">Incidencias</div>
          <h2 id="residentIncidenciasModalTitle">Nueva incidencia</h2>
        </div>
        <button id="btnCloseResidentIncModal" type="button" class="os-modal-v2__close" data-close-modal aria-label="Cerrar">×</button>
      </header>
      <form id="residentIncidenciasForm" class="os-form-v2">
        <div class="os-modal-v2__body space-y-3">
          <div class="os-field-v2">
            <label>Tipo</label>
            <select name="tipo" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
              <option value="seguridad">Seguridad</option>
              <option value="ruido">Ruido</option>
              <option value="mantenimiento">Mantenimiento</option>
              <option value="otros">Otros</option>
            </select>
          </div>
          <div class="os-field-v2">
            <label>Titulo</label>
            <input name="titulo" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" required>
          </div>
          <div class="os-field-v2">
            <label>Prioridad</label>
            <select name="prioridad" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
              <option value="baja">Baja</option>
              <option value="media" selected>Media</option>
              <option value="alta">Alta</option>
            </select>
          </div>
          <div class="os-field-v2">
            <label>Descripcion</label>
            <textarea name="descripcion" rows="4" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" required></textarea>
          </div>
        </div>
        <footer class="os-modal-v2__footer">
          <button id="btnCancelResidentIncModal" type="button" class="text-sm px-4 py-2 rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50" data-close-modal>Cancelar</button>
          <button type="submit" class="text-sm px-4 py-2 rounded-xl bg-[#EF5A5A] text-white hover:opacity-95">Guardar</button>
        </footer>
      </form>
    </section>
  </div>
</div>

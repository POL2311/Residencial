<div id="residentIncidenciasView" class="space-y-4">
  <div id="incidenciasAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
    <div>
      <h2 class="text-3xl font-semibold text-slate-700">Incidencias</h2>
    </div>
    <button id="btnNuevaIncidenciaResident" type="button"
      class="min-h-11 rounded-xl bg-[#EF5A5A] px-4 py-2 text-sm text-white shadow hover:opacity-95">
      + Reportar incidencia
    </button>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="text-sm font-semibold text-slate-700">Historial de incidencias</div>
    <div id="residentIncidenciasList" class="mt-4 space-y-3"></div>
  </div>

  <div id="residentIncidenciasModal" class="hidden fixed inset-0 z-[999] bg-black/60 backdrop-blur-sm">
    <div class="flex min-h-dvh w-full items-center justify-center p-4 pointer-events-none">
      <div class="flex max-h-[min(86dvh,640px)] w-full max-w-md flex-col overflow-hidden rounded-[1.35rem] bg-white shadow-2xl sm:max-w-lg pointer-events-auto">
        <div class="flex items-start justify-between gap-3 border-b border-slate-100 px-4 py-3">
          <div class="min-w-0">
            <div class="text-base font-semibold leading-tight text-slate-900">Nueva incidencia</div>
            <p class="mt-1 text-xs leading-5 text-slate-500">Describe lo ocurrido; tipo y prioridad ayudan a canalizarlo.</p>
          </div>
          <button id="btnCloseResidentIncModal" type="button" aria-label="Cerrar formulario" class="h-11 w-11 shrink-0 rounded-full bg-slate-100 text-slate-700 transition hover:bg-slate-200">✕</button>
        </div>
        <form id="residentIncidenciasForm" class="flex min-h-0 flex-1 flex-col">
          <div class="flex-1 space-y-4 overflow-y-auto overscroll-contain px-4 py-3">
            <fieldset>
              <legend class="mb-2 text-[11px] font-semibold uppercase tracking-wide text-slate-500">Tipo</legend>
              <div class="grid grid-cols-2 gap-2">
                <label class="cursor-pointer"><input type="radio" name="tipo" value="seguridad" class="peer sr-only" checked><span class="flex min-h-11 w-full items-center justify-center rounded-xl border border-slate-200 bg-white px-2 text-center text-xs font-semibold text-slate-600 transition peer-checked:border-rose-200 peer-checked:bg-rose-50 peer-checked:text-rose-700 peer-focus-visible:ring-2 peer-focus-visible:ring-rose-200">Seguridad</span></label>
                <label class="cursor-pointer"><input type="radio" name="tipo" value="ruido" class="peer sr-only"><span class="flex min-h-11 w-full items-center justify-center rounded-xl border border-slate-200 bg-white px-2 text-center text-xs font-semibold text-slate-600 transition peer-checked:border-rose-200 peer-checked:bg-rose-50 peer-checked:text-rose-700 peer-focus-visible:ring-2 peer-focus-visible:ring-rose-200">Ruido</span></label>
                <label class="cursor-pointer"><input type="radio" name="tipo" value="mantenimiento" class="peer sr-only"><span class="flex min-h-11 w-full items-center justify-center rounded-xl border border-slate-200 bg-white px-2 text-center text-xs font-semibold text-slate-600 transition peer-checked:border-rose-200 peer-checked:bg-rose-50 peer-checked:text-rose-700 peer-focus-visible:ring-2 peer-focus-visible:ring-rose-200">Mantenimiento</span></label>
                <label class="cursor-pointer"><input type="radio" name="tipo" value="otros" class="peer sr-only"><span class="flex min-h-11 w-full items-center justify-center rounded-xl border border-slate-200 bg-white px-2 text-center text-xs font-semibold text-slate-600 transition peer-checked:border-rose-200 peer-checked:bg-rose-50 peer-checked:text-rose-700 peer-focus-visible:ring-2 peer-focus-visible:ring-rose-200">Otros</span></label>
              </div>
            </fieldset>
            <div>
              <label class="mb-1 block text-xs font-medium text-slate-600">Titulo</label>
              <input name="titulo" class="min-h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#EF5A5A] focus:ring-2 focus:ring-[#EF5A5A]/15" placeholder="Ej. Ruido en area comun" required>
            </div>
            <fieldset>
              <legend class="mb-2 text-[11px] font-semibold uppercase tracking-wide text-slate-500">Prioridad</legend>
              <div class="grid grid-cols-3 gap-2">
                <label class="cursor-pointer"><input type="radio" name="prioridad" value="baja" class="peer sr-only"><span class="flex min-h-11 w-full items-center justify-center rounded-xl border border-slate-200 bg-white px-2 text-center text-xs font-semibold text-slate-600 transition peer-checked:border-rose-200 peer-checked:bg-rose-50 peer-checked:text-rose-700 peer-focus-visible:ring-2 peer-focus-visible:ring-rose-200">Baja</span></label>
                <label class="cursor-pointer"><input type="radio" name="prioridad" value="media" class="peer sr-only" checked><span class="flex min-h-11 w-full items-center justify-center rounded-xl border border-slate-200 bg-white px-2 text-center text-xs font-semibold text-slate-600 transition peer-checked:border-rose-200 peer-checked:bg-rose-50 peer-checked:text-rose-700 peer-focus-visible:ring-2 peer-focus-visible:ring-rose-200">Media</span></label>
                <label class="cursor-pointer"><input type="radio" name="prioridad" value="alta" class="peer sr-only"><span class="flex min-h-11 w-full items-center justify-center rounded-xl border border-slate-200 bg-white px-2 text-center text-xs font-semibold text-slate-600 transition peer-checked:border-rose-200 peer-checked:bg-rose-50 peer-checked:text-rose-700 peer-focus-visible:ring-2 peer-focus-visible:ring-rose-200">Alta</span></label>
              </div>
            </fieldset>
            <div>
              <label class="mb-1 block text-xs font-medium text-slate-600">Descripcion</label>
              <textarea name="descripcion" rows="3" class="w-full resize-none rounded-xl border border-slate-200 bg-white px-3 py-2 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#EF5A5A] focus:ring-2 focus:ring-[#EF5A5A]/15" placeholder="Cuenta brevemente que paso y donde." required></textarea>
            </div>
          </div>
          <div class="flex shrink-0 items-center gap-2 border-t border-slate-100 bg-white px-4 py-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))]">
            <button id="btnCancelResidentIncModal" type="button" class="min-h-11 rounded-xl border border-slate-200 bg-white px-4 text-sm font-medium text-slate-700 transition hover:bg-slate-50">Cancelar</button>
            <button type="submit" class="min-h-11 flex-1 rounded-xl bg-[#EF5A5A] px-4 text-sm font-semibold text-white shadow-sm transition hover:opacity-95">Reportar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

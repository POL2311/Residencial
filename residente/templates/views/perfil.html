<div id="perfilView" class="space-y-3">

  <!-- Alertas -->
  <div id="perfilAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <!-- ACCORDEÓN: MI CUENTA -->
  <section class="rounded-2xl bg-white shadow overflow-hidden">
    <button type="button"
            class="w-full px-4 py-4 flex items-center justify-between gap-3 hover:bg-slate-50"
            data-acc-btn="cuenta"
            aria-expanded="false">
      <div class="min-w-0 text-left">
        <div class="text-base font-semibold text-slate-800">Mi cuenta</div>
        <div class="text-xs text-slate-500">Nombre, dirección y contacto.</div>
      </div>

      <div class="shrink-0 flex items-center gap-2">
        <span class="text-xs text-slate-500 hidden sm:inline">Desplegar</span>
        <span class="h-9 w-9 rounded-full bg-slate-100 flex items-center justify-center">
          <svg data-acc-ico="cuenta" class="w-4 h-4 text-slate-600 transition-transform" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 0 1 .02-1.06L10.94 10 7.23 6.29a.75.75 0 1 1 1.06-1.06l4.24 4.24a.75.75 0 0 1 0 1.06l-4.24 4.24a.75.75 0 0 1-1.08.02z" clip-rule="evenodd"/>
          </svg>
        </span>
      </div>
    </button>

    <div data-acc-body="cuenta" class="hidden border-t border-slate-100">
      <div class="divide-y divide-slate-100">

        <!-- Nombre -->
        <button type="button"
                class="w-full px-4 py-4 flex items-center justify-between gap-3 hover:bg-slate-50"
                data-open="update_name">
          <div class="text-left min-w-0">
            <div class="text-xs text-slate-500">Nombre</div>
            <div id="v_name" class="min-w-0 break-words text-sm font-semibold text-slate-800">—</div>
          </div>
          <div class="shrink-0 flex items-center gap-2">
            <span class="text-xs text-[#2E5D73] font-medium">Actualizar</span>
            <svg class="w-4 h-4 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 0 1 .02-1.06L10.94 10 7.23 6.29a.75.75 0 1 1 1.06-1.06l4.24 4.24a.75.75 0 0 1 0 1.06l-4.24 4.24a.75.75 0 0 1-1.08.02z" clip-rule="evenodd"/>
            </svg>
          </div>
        </button>

        <!-- Dirección (solo visual) -->
        <div class="px-4 py-4">
          <div class="text-xs text-slate-500">Dirección</div>
          <div id="v_direccion" class="min-w-0 break-words text-sm font-semibold text-slate-800">—</div>
          <div class="text-[11px] text-slate-400 mt-0.5">Solo lectura</div>
        </div>

        <!-- Teléfono -->
        <button type="button"
                class="w-full px-4 py-4 flex items-center justify-between gap-3 hover:bg-slate-50"
                data-open="update_phone">
          <div class="text-left min-w-0">
            <div class="text-xs text-slate-500">Teléfono</div>
            <div id="v_telefono" class="min-w-0 break-words text-sm font-semibold text-slate-800">—</div>
          </div>
          <div class="shrink-0 flex items-center gap-2">
            <span class="text-xs text-[#2E5D73] font-medium">Actualizar</span>
            <svg class="w-4 h-4 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 0 1 .02-1.06L10.94 10 7.23 6.29a.75.75 0 1 1 1.06-1.06l4.24 4.24a.75.75 0 0 1 0 1.06l-4.24 4.24a.75.75 0 0 1-1.08.02z" clip-rule="evenodd"/>
            </svg>
          </div>
        </button>

        <!-- Correo -->
        <button type="button"
                class="w-full px-4 py-4 flex items-center justify-between gap-3 hover:bg-slate-50"
                data-open="update_email">
          <div class="text-left min-w-0">
            <div class="text-xs text-slate-500">Correo electrónico</div>
            <div id="v_email" class="min-w-0 break-words text-sm font-semibold text-slate-800">—</div>
          </div>
          <div class="shrink-0 flex items-center gap-2">
            <span class="text-xs text-[#2E5D73] font-medium">Actualizar</span>
            <svg class="w-4 h-4 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 0 1 .02-1.06L10.94 10 7.23 6.29a.75.75 0 1 1 1.06-1.06l4.24 4.24a.75.75 0 0 1 0 1.06l-4.24 4.24a.75.75 0 0 1-1.08.02z" clip-rule="evenodd"/>
            </svg>
          </div>
        </button>

      </div>
    </div>
  </section>

  <!-- ACCORDEÓN: SEGURIDAD -->
  <section class="rounded-2xl bg-white shadow overflow-hidden">
    <button type="button"
            class="w-full px-4 py-4 flex items-center justify-between gap-3 hover:bg-slate-50"
            data-acc-btn="seguridad"
            aria-expanded="false">
      <div class="min-w-0 text-left">
        <div class="text-base font-semibold text-slate-800">Seguridad</div>
        <div class="text-xs text-slate-500">Actualiza tu contraseña.</div>
      </div>

      <div class="shrink-0 flex items-center gap-2">
        <span class="text-xs text-slate-500 hidden sm:inline">Desplegar</span>
        <span class="h-9 w-9 rounded-full bg-slate-100 flex items-center justify-center">
          <svg data-acc-ico="seguridad" class="w-4 h-4 text-slate-600 transition-transform" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 0 1 .02-1.06L10.94 10 7.23 6.29a.75.75 0 1 1 1.06-1.06l4.24 4.24a.75.75 0 0 1 0 1.06l-4.24 4.24a.75.75 0 0 1-1.08.02z" clip-rule="evenodd"/>
          </svg>
        </span>
      </div>
    </button>

    <div data-acc-body="seguridad" class="hidden border-t border-slate-100">
      <div class="divide-y divide-slate-100">
        <button type="button"
                class="w-full px-4 py-4 flex items-center justify-between gap-3 hover:bg-slate-50"
                data-open="change_password">
          <div class="text-left min-w-0">
            <div class="text-sm font-semibold text-slate-800">Cambiar contraseña</div>
            <div class="text-xs text-slate-500">Se pedirá la contraseña actual.</div>
          </div>
          <div class="shrink-0 flex items-center gap-2">
            <span class="text-xs text-[#2E5D73] font-medium">Cambiar</span>
            <svg class="w-4 h-4 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 0 1 .02-1.06L10.94 10 7.23 6.29a.75.75 0 1 1 1.06-1.06l4.24 4.24a.75.75 0 0 1 0 1.06l-4.24 4.24a.75.75 0 0 1-1.08.02z" clip-rule="evenodd"/>
            </svg>
          </div>
        </button>
      </div>
    </div>
  </section>

  <!-- ACCORDEÓN: CONTACTOS -->
  <section class="rounded-2xl bg-white shadow overflow-hidden">
    <button type="button"
            class="w-full px-4 py-4 flex items-center justify-between gap-3 hover:bg-slate-50"
            data-acc-btn="contactos"
            aria-expanded="false">
      <div class="min-w-0 text-left">
        <div class="text-base font-semibold text-slate-800">Contactos de emergencia</div>
        <div class="text-xs text-slate-500">Agrega números para casos urgentes.</div>
      </div>

      <div class="shrink-0 flex items-center gap-2">
        <span class="text-xs text-slate-500 hidden sm:inline">Desplegar</span>
        <span class="h-9 w-9 rounded-full bg-slate-100 flex items-center justify-center">
          <svg data-acc-ico="contactos" class="w-4 h-4 text-slate-600 transition-transform" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 0 1 .02-1.06L10.94 10 7.23 6.29a.75.75 0 1 1 1.06-1.06l4.24 4.24a.75.75 0 0 1 0 1.06l-4.24 4.24a.75.75 0 0 1-1.08.02z" clip-rule="evenodd"/>
          </svg>
        </span>
      </div>
    </button>

    <div data-acc-body="contactos" class="hidden border-t border-slate-100">
      <div class="p-4 space-y-3">

      <div class="flex items-center justify-start sm:justify-end">
          <button id="btnAddCE" type="button"
                  class="min-h-11 rounded-full bg-[#2E5D73] px-4 py-2 text-xs text-white hover:opacity-95">
            Agregar
          </button>
        </div>

        <div id="ceNoTable" class="hidden">
          <div class="rounded-2xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800">
            No existe la tabla <b>contactos_emergencia</b>. Si quieres, crea esta tabla:
            <pre class="mt-2 text-xs bg-white/70 border border-amber-200 rounded-xl p-3 overflow-x-auto"><code id="ceSql"></code></pre>
          </div>
        </div>

        <div id="ceEmpty" class="hidden">
          <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-600">
            Aún no tienes contactos. Presiona <b>Agregar</b>.
          </div>
        </div>

        <div id="ceList" class="space-y-2"></div>

      </div>
    </div>
  </section>

  <!-- ACCORDEÓN: AUTOMÓVILES -->
  <section class="rounded-2xl bg-white shadow overflow-hidden">
    <button type="button"
            class="w-full px-4 py-4 flex items-center justify-between gap-3 hover:bg-slate-50"
            data-acc-btn="autos"
            aria-expanded="false">
      <div class="min-w-0 text-left">
        <div class="text-base font-semibold text-slate-800">Automóviles</div>
        <div class="text-xs text-slate-500">Agrega, edita o elimina tus autos.</div>
      </div>

      <div class="shrink-0 flex items-center gap-2">
        <span class="text-xs text-slate-500 hidden sm:inline">Desplegar</span>
        <span class="h-9 w-9 rounded-full bg-slate-100 flex items-center justify-center">
          <svg data-acc-ico="autos" class="w-4 h-4 text-slate-600 transition-transform" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 0 1 .02-1.06L10.94 10 7.23 6.29a.75.75 0 1 1 1.06-1.06l4.24 4.24a.75.75 0 0 1 0 1.06l-4.24 4.24a.75.75 0 0 1-1.08.02z" clip-rule="evenodd"/>
          </svg>
        </span>
      </div>
    </button>

    <div data-acc-body="autos" class="hidden border-t border-slate-100">
      <div class="p-4 space-y-3">

        <div class="flex items-center justify-end">
          <button id="btnAddAuto" type="button"
                  class="min-h-11 rounded-full bg-[#2E5D73] px-4 py-2 text-xs text-white hover:opacity-95">
            Agregar
          </button>
        </div>

        <div id="autosEmpty" class="hidden">
          <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-600">
            Aún no tienes autos. Presiona <b>Agregar</b>.
          </div>
        </div>

        <div id="autosList" class="space-y-2"></div>

      </div>
    </div>
  </section>

  <!-- MODAL (ÚNICO) -->
  <div id="modal" class="hidden fixed inset-0 z-[999] bg-black/60 backdrop-blur-sm">
    <div class="flex min-h-dvh w-full items-center justify-center p-4 pointer-events-none">
      <div class="flex max-h-[min(86dvh,640px)] w-full max-w-md flex-col overflow-hidden rounded-[1.35rem] bg-white shadow-2xl sm:max-w-lg pointer-events-auto">
        <div class="flex items-start justify-between gap-3 border-b border-slate-100 px-4 py-3">
          <div class="min-w-0">
            <div id="modalTitle" class="text-base font-semibold leading-tight text-slate-900">—</div>
            <p class="mt-1 text-xs leading-5 text-slate-500">Actualiza solo lo necesario y guarda los cambios.</p>
          </div>
          <button id="btnCloseModal" type="button"
                  aria-label="Cerrar formulario"
                  class="h-11 w-11 shrink-0 rounded-full bg-slate-100 text-slate-700 transition hover:bg-slate-200">✕</button>
        </div>

        <form id="modalForm" class="flex min-h-0 flex-1 flex-col">
          <input type="hidden" id="modalAction" name="action" value="">
          <div id="modalBody" class="flex-1 space-y-3 overflow-y-auto overscroll-contain px-4 py-3"></div>

          <div class="flex shrink-0 items-center gap-2 border-t border-slate-100 bg-white px-4 py-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))]">
            <button id="btnCancelModal" type="button"
                    class="min-h-11 rounded-xl border border-slate-200 bg-white px-4 text-sm font-medium text-slate-700 transition hover:bg-slate-50">
              Cancelar
            </button>
            <button id="btnSaveModal" type="submit"
                    class="min-h-11 flex-1 rounded-xl bg-[#2E5D73] px-4 text-sm font-semibold text-white shadow-sm transition hover:opacity-95">
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

</div>

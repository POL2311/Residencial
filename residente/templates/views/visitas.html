<div id="residentVisitasView" class="space-y-4">
  <div id="visitasAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
    <div>
      <h2 class="text-3xl font-semibold text-slate-700">Visitas</h2>
      <p class="text-sm text-slate-500">Registra visitas y comparte el codigo de acceso con tus invitados.</p>
    </div>
    <button id="btnNuevaVisitaResident" type="button"
      class="rounded-xl bg-[#4E7287] px-4 py-2 text-sm text-white shadow hover:opacity-95">
      + Nueva visita
    </button>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="text-sm font-semibold text-slate-700">Historial de accesos generados</div>
    <div id="residentVisitasList" class="mt-4 space-y-3"></div>
  </div>

  <div id="residentVisitasModal" class="os-modal-v2 hidden z-50">
    <div class="os-modal-v2__backdrop" data-close-modal></div>
    <section class="os-modal-v2__panel os-modal-v2__panel--form os-modal-v2__panel--full-mobile" role="dialog" aria-modal="true" aria-labelledby="residentVisitasModalTitle">
      <header class="os-modal-v2__header">
        <div>
          <div class="os-modal-v2__eyebrow">Visitas</div>
          <h2 id="residentVisitasModalTitle">Visita</h2>
        </div>
        <button id="btnCloseResidentVisitasModal" type="button" class="os-modal-v2__close" data-close-modal aria-label="Cerrar">×</button>
      </header>
      <form id="residentVisitasForm" class="os-form-v2">
        <div class="os-modal-v2__body space-y-3">
          <div class="os-field-v2">
            <label>Tipo</label>
            <select name="tipo" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
              <option value="visita">Visita</option>
              <option value="servicio">Servicio</option>
              <option value="trabajador_recurrente">Trabajador recurrente</option>
            </select>
          </div>
          <div class="os-field-v2">
            <label>Nombre del visitante</label>
            <input name="nombre_visitante" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" required>
          </div>
          <div class="os-form-v2__grid">
            <div class="os-field-v2">
              <label>Fecha desde</label>
              <input type="date" name="fecha_desde" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" required>
            </div>
            <div class="os-field-v2">
              <label>Fecha hasta</label>
              <input type="date" name="fecha_hasta" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" required>
            </div>
          </div>
          <div class="os-form-v2__grid">
            <div class="os-field-v2">
              <label>Hora desde</label>
              <input type="time" name="hora_desde" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
            </div>
            <div class="os-field-v2">
              <label>Hora hasta</label>
              <input type="time" name="hora_hasta" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
            </div>
          </div>
          <div class="os-field-v2">
            <label>Motivo</label>
            <input name="motivo" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
          </div>
          <div class="os-field-v2">
            <label>Placa del vehiculo</label>
            <input name="placa_vehiculo" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
          </div>
          <div class="os-field-v2">
            <label>Notas</label>
            <textarea name="notas" rows="3" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"></textarea>
          </div>
          <label class="flex items-center gap-2 text-sm text-slate-600">
            <input type="checkbox" name="uso_unico" value="1" checked>
            Uso unico
          </label>
        </div>
        <footer class="os-modal-v2__footer">
            <button id="btnCancelResidentVisitasModal" type="button" class="text-sm px-4 py-2 rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50" data-close-modal>Cancelar</button>
            <button type="submit" class="text-sm px-4 py-2 rounded-xl bg-[#4E7287] text-white hover:opacity-95">Guardar</button>
        </footer>
      </form>
    </section>
  </div>

  <div id="residentVisitasCodeModal" class="os-modal-v2 hidden z-50">
    <div class="os-modal-v2__backdrop" data-close-modal></div>
    <section class="os-modal-v2__panel os-modal-v2__panel--compact" role="dialog" aria-modal="true" aria-labelledby="residentVisitasCodeTitle">
      <header class="os-modal-v2__header">
        <div>
          <div class="os-modal-v2__eyebrow">Acceso</div>
          <h2 id="residentVisitasCodeTitle">Código de acceso</h2>
        </div>
        <button id="btnCloseResidentVisitasCodeModal" type="button" class="os-modal-v2__close" data-close-modal aria-label="Cerrar">×</button>
      </header>
        <div class="os-modal-v2__body space-y-4">
          <p class="text-sm text-slate-500">Comparte este código con tu invitado para el acceso.</p>
          <div id="residentVisitasCodeValue"
            class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-5 text-center font-mono text-3xl font-bold tracking-[0.35em] text-slate-800">
            ----
          </div>
          <div class="rounded-2xl border border-slate-200 bg-white p-4">
            <div class="text-xs font-semibold uppercase tracking-wide text-slate-500">QR para caseta</div>
            <div class="mt-3 flex justify-center">
              <img id="residentVisitasQrImage"
                alt="QR de acceso"
                class="max-w-full rounded-2xl bg-white"
                width="220"
                height="220" />
            </div>
            <p id="residentVisitasQrHint" class="mt-3 text-center text-xs text-slate-500">
              El guardia puede escanear este QR o capturar el código manualmente.
            </p>
          </div>
          <div class="os-modal-v2__footer os-modal-v2__footer--inline">
            <button id="btnDismissResidentVisitasCodeModal" type="button"
              class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm text-slate-700 hover:bg-slate-50" data-close-modal>
              Cerrar
            </button>
            <button id="btnDownloadResidentVisitasQr" type="button"
              class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">
              Descargar QR
            </button>
            <button id="btnCopyResidentVisitasCode" type="button"
              class="rounded-xl bg-[#4E7287] px-4 py-2 text-sm text-white hover:opacity-95">
              Copiar código
            </button>
          </div>
        </div>
    </section>
  </div>
</div>

<div id="residentAutosView" class="space-y-4">
  <div id="autosAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
    <div>
      <h2 class="text-3xl font-semibold text-slate-700">Autos</h2>
    </div>
    <button id="btnNuevoAutoResident" type="button"
      class="rounded-xl bg-[#4E7287] px-4 py-2 text-sm text-white shadow hover:opacity-95">
      + Agregar auto
    </button>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div id="residentAutosList" class="max-h-[26rem] space-y-3 overflow-y-auto pr-1"></div>
  </div>

  <div id="residentAutosModal" class="os-modal-v2 hidden z-50">
    <div class="os-modal-v2__backdrop" data-close-modal></div>
    <section class="os-modal-v2__panel os-modal-v2__panel--form os-modal-v2__panel--full-mobile" role="dialog" aria-modal="true" aria-labelledby="residentAutosModalTitle">
      <header class="os-modal-v2__header">
        <div>
          <div class="os-modal-v2__eyebrow">Vehículos</div>
          <h2 id="residentAutosModalTitle">Auto</h2>
        </div>
        <button id="btnCloseResidentAutosModal" type="button" class="os-modal-v2__close" data-close-modal aria-label="Cerrar">×</button>
      </header>
      <form id="residentAutosForm" class="os-form-v2">
        <input type="hidden" id="residentAutosAction" name="action" value="">
        <div id="residentAutosBody" class="os-modal-v2__body space-y-3"></div>
        <footer class="os-modal-v2__footer">
          <button id="btnCancelResidentAutosModal" type="button" class="text-sm px-4 py-2 rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50" data-close-modal>Cancelar</button>
          <button id="btnSaveResidentAutosModal" type="submit" class="text-sm px-4 py-2 rounded-xl bg-[#2E5D73] text-white hover:opacity-95">Guardar</button>
        </footer>
      </form>
    </section>
  </div>
</div>

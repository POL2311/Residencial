<div id="residentAutosView" class="space-y-4">
  <div id="autosAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
    <div>
      <h2 class="text-3xl font-semibold text-slate-700">Autos</h2>
    </div>
    <button id="btnNuevoAutoResident" type="button"
      class="rounded-xl bg-[#4E7287] px-4 py-2 text-sm text-white shadow hover:opacity-95">
      + Agregar auto
    </button>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div id="residentAutosList" class="max-h-[26rem] space-y-3 overflow-y-auto pr-1"></div>
  </div>

  <div id="residentAutosModal" class="app-modal-overlay hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm">
    <div class="app-modal-viewport min-h-full flex items-center justify-center">
      <div class="app-modal-card w-full md:max-w-lg bg-white shadow-2xl">
        <div class="app-modal-header px-4 py-3 border-b border-slate-100 flex items-center justify-between">
          <div id="residentAutosModalTitle" class="text-sm font-semibold text-slate-800">Auto</div>
          <button id="btnCloseResidentAutosModal" type="button" class="h-9 w-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700">✕</button>
        </div>
        <form id="residentAutosForm" class="flex min-h-0 flex-1 flex-col">
          <div class="app-modal-body space-y-3 p-4">
            <input type="hidden" id="residentAutosAction" name="action" value="">
            <div id="residentAutosBody" class="space-y-3"></div>
          </div>
          <div class="app-modal-footer flex flex-col-reverse gap-2 border-t border-slate-100 bg-white px-4 py-3 sm:flex-row sm:justify-end">
            <button id="btnCancelResidentAutosModal" type="button" class="text-sm px-4 py-2 rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50">Cancelar</button>
            <button id="btnSaveResidentAutosModal" type="submit" class="text-sm px-4 py-2 rounded-xl bg-[#2E5D73] text-white hover:opacity-95">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

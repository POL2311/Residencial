<div id="residentAutosView" class="space-y-4">
  <div id="autosAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
    <div>
      <h2 class="text-3xl font-semibold text-slate-700">Autos</h2>
    </div>
    <button id="btnNuevoAutoResident" type="button"
      class="min-h-11 rounded-xl bg-[#4E7287] px-4 py-2 text-sm text-white shadow hover:opacity-95">
      + Agregar auto
    </button>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div id="residentAutosList" class="max-h-[26rem] space-y-3 overflow-y-auto pr-1"></div>
  </div>

  <div id="residentAutosModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm">
    <div class="box-border flex h-full items-end justify-center px-3 pb-[max(12px,env(safe-area-inset-bottom))] pt-3 sm:items-center sm:p-4">
      <div class="flex max-h-[min(86dvh,640px)] w-full max-w-md flex-col overflow-hidden rounded-[1.35rem] bg-white shadow-2xl sm:max-w-lg">
        <div class="flex items-start justify-between gap-3 border-b border-slate-100 px-4 py-3">
          <div class="min-w-0">
            <div id="residentAutosModalTitle" class="text-base font-semibold leading-tight text-slate-900">Auto</div>
            <p class="mt-1 text-xs leading-5 text-slate-500">Registra placas primero; los detalles del auto son opcionales.</p>
          </div>
          <button id="btnCloseResidentAutosModal" type="button" aria-label="Cerrar formulario" class="h-11 w-11 shrink-0 rounded-full bg-slate-100 text-slate-700 transition hover:bg-slate-200">✕</button>
        </div>
        <form id="residentAutosForm" class="flex min-h-0 flex-1 flex-col">
          <input type="hidden" id="residentAutosAction" name="action" value="">
          <div id="residentAutosBody" class="flex-1 space-y-3 overflow-y-auto overscroll-contain px-4 py-3"></div>
          <div class="flex shrink-0 items-center gap-2 border-t border-slate-100 bg-white px-4 py-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))]">
            <button id="btnCancelResidentAutosModal" type="button" class="min-h-11 rounded-xl border border-slate-200 bg-white px-4 text-sm font-medium text-slate-700 transition hover:bg-slate-50">Cancelar</button>
            <button id="btnSaveResidentAutosModal" type="submit" class="min-h-11 flex-1 rounded-xl bg-[#2E5D73] px-4 text-sm font-semibold text-white shadow-sm transition hover:opacity-95">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div id="perfilView" class="space-y-5">

  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
    <div>
      <h2 class="text-3xl font-semibold text-slate-700">Perfil</h2>
      <p class="text-sm text-slate-500">
        Administra tus datos de acceso y la información básica de tu cuenta.
      </p>
    </div>
  </div>

  <div id="perfilAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <section class="rounded-2xl bg-white shadow overflow-hidden">
    <button
      type="button"
      class="w-full px-4 py-4 flex items-center justify-between gap-3 hover:bg-slate-50"
      data-acc-btn="cuenta"
      aria-expanded="false">
      <div class="text-left">
        <div class="text-base font-semibold text-slate-800">Mi cuenta</div>
        <div class="text-xs text-slate-500">Nombre, correo y teléfono</div>
      </div>

      <svg class="w-4 h-4 text-slate-500 transition-transform" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M7.21 14.77a.75.75 0 0 1 .02-1.06L10.94 10 7.23 6.29a.75.75 0 1 1 1.06-1.06l4.24 4.24a.75.75 0 0 1 0 1.06l-4.24 4.24a.75.75 0 0 1-1.08.02z"
          clip-rule="evenodd"/>
      </svg>
    </button>

    <div data-acc-body="cuenta" class="hidden border-t border-slate-100">
      <div class="divide-y divide-slate-100">
        <button data-open="update_name" class="w-full px-4 py-4 text-left hover:bg-slate-50">
          <div class="text-xs text-slate-500">Nombre</div>
          <div id="v_name" class="font-semibold text-slate-800">—</div>
        </button>

        <button data-open="update_email" class="w-full px-4 py-4 text-left hover:bg-slate-50">
          <div class="text-xs text-slate-500">Correo</div>
          <div id="v_email" class="font-semibold text-slate-800">—</div>
        </button>

        <button data-open="update_phone" class="w-full px-4 py-4 text-left hover:bg-slate-50">
          <div class="text-xs text-slate-500">Teléfono</div>
          <div id="v_telefono" class="font-semibold text-slate-800">—</div>
        </button>
      </div>
    </div>
  </section>

  <section class="rounded-2xl bg-white shadow overflow-hidden">
    <button
      type="button"
      class="w-full px-4 py-4 flex items-center justify-between gap-3 hover:bg-slate-50"
      data-acc-btn="seguridad"
      aria-expanded="false">
      <div class="text-left">
        <div class="text-base font-semibold text-slate-800">Seguridad</div>
        <div class="text-xs text-slate-500">Actualiza tu contraseña</div>
      </div>

      <svg class="w-4 h-4 text-slate-500 transition-transform" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M7.21 14.77a.75.75 0 0 1 .02-1.06L10.94 10 7.23 6.29a.75.75 0 1 1 1.06-1.06l4.24 4.24a.75.75 0 0 1 0 1.06l-4.24 4.24a.75.75 0 0 1-1.08.02z"
          clip-rule="evenodd"/>
      </svg>
    </button>

    <div data-acc-body="seguridad" class="hidden border-t border-slate-100">
      <button data-open="change_password" class="w-full px-4 py-4 text-left hover:bg-slate-50">
        Cambiar contraseña
      </button>
    </div>
  </section>

</div>

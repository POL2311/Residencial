<!-- guardia/templates/views/incidencias.html -->
<div class="space-y-5" id="incidenciasView">

  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
    <div>
      <h2 class="text-3xl font-semibold text-slate-700">Incidencias</h2>
    </div>

    <button id="btnNuevaInc"
      type="button"
      class="rounded-xl bg-[#4E7287] text-white px-4 py-2 text-sm shadow hover:opacity-95">
      + Nueva incidencia
    </button>
  </div>

  <div class="rounded-2xl bg-white shadow p-4 border border-slate-200">
    <form id="frmIncFilter" class="mt-4 grid grid-cols-1 md:grid-cols-5 gap-2">
      <input id="incSearch"
        class="rounded-xl border border-slate-200 px-3 py-2 text-sm"
        placeholder="Buscar incidencia..." />

      <select id="incEstado"
        class="rounded-xl border border-slate-200 px-3 py-2 text-sm">
        <option value="">Todos los estados</option>
        <option value="abierta">Abierta</option>
        <option value="en_proceso">En proceso</option>
        <option value="cerrada">Cerrada</option>
      </select>

      <select id="incPrioridad"
        class="rounded-xl border border-slate-200 px-3 py-2 text-sm">
        <option value="">Todas las prioridades</option>
        <option value="alta">Alta</option>
        <option value="media">Media</option>
        <option value="baja">Baja</option>
      </select>

      <select id="incTipoFilter"
        class="rounded-xl border border-slate-200 px-3 py-2 text-sm">
        <option value="">Todos los tipos</option>
        <option value="seguridad">Seguridad</option>
        <option value="ruido">Ruido</option>
        <option value="mantenimiento">Mantenimiento</option>
        <option value="otros">Otros</option>
      </select>

      <div class="flex gap-2">
        <button
          type="submit"
          class="flex-1 rounded-xl bg-[#4E7287] text-white px-4 py-2 text-sm shadow hover:opacity-95">
          Buscar
        </button>

        <button
          type="button"
          id="btnClearIncFilters"
          class="rounded-xl border px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">
          Limpiar
        </button>
      </div>
    </form>
    <div id="incList" class="mt-4 text-xs text-slate-500">Cargando…</div>
    <div id="incPagination" class="mt-4 flex justify-end gap-2"></div>
  </div>

</div>

<!-- guardia/templates/views/autos.html -->
<div class="space-y-5" id="autosView">

  <!-- HEADER -->
  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
    <div>
      <h2 class="text-3xl font-semibold text-slate-700">Autos</h2>
      <p class="text-sm text-slate-500">
        Consulta, registra y administra los autos asociados al residencial.
      </p>
    </div>

    <button id="btnNuevoAuto"
      type="button"
      class="rounded-xl bg-[#4E7287] text-white px-4 py-2 text-sm shadow hover:opacity-95">
      + Nuevo auto
    </button>
  </div>

  <!-- FILTROS -->
  <div class="rounded-2xl bg-white shadow p-4 border border-slate-200">
    <div class="text-sm font-semibold text-slate-700">Filtros de búsqueda</div>
    <div class="text-xs text-slate-500 mt-1">
      Busca por placas, modelo o color para encontrar rápidamente un auto.
    </div>

    <form id="frmAutosFilter" class="mt-4 grid grid-cols-1 md:grid-cols-4 gap-2">
      <input id="fPlacas"
        class="rounded-xl border border-slate-200 px-3 py-2 text-sm"
        placeholder="Placas" />

      <input id="fModelo"
        class="rounded-xl border border-slate-200 px-3 py-2 text-sm"
        placeholder="Modelo" />

      <input id="fColor"
        class="rounded-xl border border-slate-200 px-3 py-2 text-sm"
        placeholder="Color" />

      <div class="flex gap-2">
        <button
          type="submit"
          class="flex-1 rounded-xl bg-[#4E7287] text-white px-4 py-2 text-sm shadow hover:opacity-95">
          Buscar
        </button>

        <button
          id="btnClearAutosFilters"
          type="button"
          class="rounded-xl border px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">
          Limpiar
        </button>
      </div>
    </form>
  </div>

  <!-- LISTADO -->
  <div class="rounded-2xl bg-white shadow p-4 border border-slate-200">
    <div class="flex items-center justify-between gap-3">
      <div>
        <div class="text-sm font-semibold text-slate-700">Listado de autos</div>
        <div class="text-xs text-slate-500 mt-1">
          Selecciona un auto para editarlo o desactivarlo.
        </div>
      </div>
    </div>

    <div id="autosList" class="mt-4 text-xs text-slate-500">Cargando…</div>
    <div id="autosPagination" class="mt-4 flex justify-end gap-2"></div>
  </div>

</div>

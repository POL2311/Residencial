  </div>

  <div class="rounded-2xl bg-white shadow p-4">

    <form id="frmAutosFilter" class="mt-3 grid grid-cols-1 md:grid-cols-3 gap-2">

      <input id="fModelo" class="rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="Modelo" />

    <div id="autosList" class="mt-3 text-xs text-slate-500">Cargando…</div>

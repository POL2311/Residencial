<!-- guardia/templates/views/autos.html -->
<div class="space-y-5" id="autosView">

  <!-- HEADER -->
  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
    <div>
      <h2 class="text-3xl font-semibold text-slate-700">Autos</h2>
    </div>

    <button id="btnNuevoAuto"
      type="button"
      class="rounded-xl bg-[#4E7287] text-white px-4 py-2 text-sm shadow hover:opacity-95">
      + Nuevo auto
    </button>
  </div>

  <div class="rounded-2xl bg-white shadow p-4 border border-slate-200">
    <form id="frmAutosFilter" class="grid grid-cols-1 md:grid-cols-4 gap-2">
      <input id="fPlacas"
        class="rounded-xl border border-slate-200 px-3 py-2 text-sm"
        placeholder="Placas" />

      <input id="fModelo"
        class="rounded-xl border border-slate-200 px-3 py-2 text-sm"
        placeholder="Modelo" />

      <input id="fColor"
        class="rounded-xl border border-slate-200 px-3 py-2 text-sm"
        placeholder="Color" />

      <div class="flex gap-2">
        <button
          type="submit"
          class="flex-1 rounded-xl bg-[#4E7287] text-white px-4 py-2 text-sm shadow hover:opacity-95">
          Buscar
        </button>

        <button
          id="btnClearAutosFilters"
          type="button"
          class="rounded-xl border px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">
          Limpiar
        </button>
      </div>
    </form>
    <div id="autosList" class="mt-4 max-h-[26rem] overflow-y-auto pr-1 text-xs text-slate-500">Cargando…</div>
    <div id="autosPagination" class="mt-4 flex justify-end gap-2"></div>
  </div>

</div>

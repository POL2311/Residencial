<!-- guardia/templates/views/paqueteria.html -->
<div class="space-y-5" id="paqueteriaView">

  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
    <div>
      <h2 class="text-3xl font-semibold text-slate-700">Paquetería</h2>
    </div>

    <button id="btnNuevoPkg"
      type="button"
      class="rounded-xl bg-[#4E7287] text-white px-4 py-2 text-sm shadow hover:opacity-95">
      + Nuevo paquete
    </button>
  </div>

  <div class="rounded-2xl bg-white shadow p-4 border border-slate-200">
    <form id="frmPkgFilter" class="grid grid-cols-1 md:grid-cols-4 gap-2">
      <input id="pkgSearch"
        class="rounded-xl border border-slate-200 px-3 py-2 text-sm"
        placeholder="Buscar paquete..." />

      <select id="pkgEstado"
        class="rounded-xl border border-slate-200 px-3 py-2 text-sm">
        <option value="">Todos los estados</option>
        <option value="registrado">Pendiente</option>
        <option value="entregado">Entregado</option>
        <option value="devuelto">Devuelto</option>
      </select>

      <div class="flex gap-2">
        <button
          type="submit"
          class="flex-1 rounded-xl bg-[#4E7287] text-white px-4 py-2 text-sm shadow hover:opacity-95">
          Buscar
        </button>

        <button
          id="btnClearPkgFilters"
          type="button"
          class="rounded-xl border px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">
          Limpiar
        </button>
      </div>
    </form>
    <div class="mt-4 flex justify-end">
      <button id="btnRefreshPkg"
        type="button"
        class="rounded-lg border px-3 py-2 text-sm text-slate-600 hover:bg-slate-50">
        Refrescar
      </button>
    </div>

    <div id="pkgList" class="mt-4 text-xs text-slate-500">Cargando…</div>
    <div id="pkgPagination" class="mt-4 flex justify-end gap-2"></div>
  </div>

</div>

<div id="guardAmenidadesView" class="space-y-4">
  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="app-admin-kicker">Consulta operativa</div>
    <h1 class="app-admin-title">Amenidades</h1>
    <p class="app-admin-subtitle">Revisa solicitudes y reservas de espacios compartidos. Esta vista es solo de consulta.</p>
  </div>

  <div id="guardAmenidadesAlert" class="hidden rounded-2xl px-4 py-3 text-sm"></div>

  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="grid gap-3 md:grid-cols-[1fr_1fr_auto] md:items-end">
      <div>
        <label class="mb-1 block text-xs text-slate-500">Fecha</label>
        <input id="guardAmenidadesFecha" type="date" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="mb-1 block text-xs text-slate-500">Estado</label>
        <select id="guardAmenidadesEstado" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
          <option value="">Todos</option>
          <option value="pendiente">Pendientes</option>
          <option value="aprobada">Aprobadas</option>
          <option value="rechazada">Rechazadas</option>
          <option value="cancelada">Canceladas</option>
        </select>
      </div>
      <button id="btnFiltrarGuardAmenidades" type="button" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700">
        Filtrar
      </button>
    </div>
  </div>

  <div id="guardAmenidadesList" class="space-y-3"></div>
</div>

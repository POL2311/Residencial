<div id="guardiaHomeView" class="space-y-6">
  <section class="rounded-[2rem] border border-slate-200 bg-white px-5 py-6 shadow-sm">
    <div class="app-admin-kicker">Centro operativo</div>
    <h1 class="app-admin-title">Operación de acceso en tiempo real</h1>
    <p class="app-admin-subtitle">Consulta métricas del turno, resuelve incidencias y entra rápido a los módulos críticos de la caseta.</p>
  </section>

  <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="rounded-3xl bg-white border border-slate-200 p-5 shadow-sm">
      <div class="text-sm text-slate-500">Accesos hoy</div>
      <div id="statAccesosHoy" class="mt-2 text-3xl font-bold text-slate-900">0</div>
    </div>

    <div class="rounded-3xl bg-white border border-slate-200 p-5 shadow-sm">
      <div class="text-sm text-slate-500">Incidencias abiertas</div>
      <div id="statIncidenciasAbiertas" class="mt-2 text-3xl font-bold text-rose-600">0</div>
    </div>

    <div class="rounded-3xl bg-white border border-slate-200 p-5 shadow-sm">
      <div class="text-sm text-slate-500">Paquetes pendientes</div>
      <div id="statPaquetesPendientes" class="mt-2 text-3xl font-bold text-amber-600">0</div>
    </div>

    <div class="rounded-3xl bg-white border border-slate-200 p-5 shadow-sm">
      <div class="text-sm text-slate-500">Autos registrados hoy</div>
      <div id="statAutosHoy" class="mt-2 text-3xl font-bold text-sky-600">0</div>
    </div>
  </section>

  <section class="grid grid-cols-1 gap-4">
    <div class="rounded-3xl bg-white border border-slate-200 p-5 shadow-sm">
      <h2 class="text-lg font-semibold text-slate-800">Acciones rápidas</h2>

      <div class="space-y-3">
        <button data-home-action="accesos"
          class="w-full rounded-2xl bg-[#4E7287] text-white px-4 py-4 text-left hover:opacity-95">
          Registrar acceso
        </button>

        <button data-home-action="incidencias"
          class="w-full rounded-2xl bg-[#EF5A5A] text-white px-4 py-4 text-left hover:opacity-95">
          Nueva incidencia
        </button>

        <button data-home-action="paqueteria"
          class="w-full rounded-2xl bg-[#4E7287] text-white px-4 py-4 text-left hover:opacity-95">
          Registrar paquete
        </button>

        <button data-home-action="autos"
          class="w-full rounded-2xl bg-[#4E7287] text-white px-4 py-4 text-left hover:opacity-95">
          Buscar auto
        </button>
      </div>
    </div>
  </section>

</div>

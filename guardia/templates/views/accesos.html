<div class="space-y-5" id="accesosView">

  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
    <div>
      <h2 class="text-3xl font-semibold text-slate-700">Control de accesos</h2>
    </div>
  </div>

  <div class="rounded-2xl bg-white shadow p-4 border border-slate-200">
    <div class="flex flex-col lg:flex-row gap-2">
      <button id="btnOpenCamera"
        class="rounded-xl bg-slate-800 text-white px-4 py-2 text-sm hover:bg-slate-900">
        📷 Escanear QR
      </button>

      <input id="codigo"
        class="flex-1 rounded-xl border px-3 py-2 text-sm"
        placeholder="Ingresar código manual" />

      <button id="btnBuscar"
        class="rounded-xl bg-[#4E7287] text-white px-4 py-2 text-sm hover:opacity-95">
        Buscar
      </button>
    </div>

    <div id="accesosAlert"
      class="hidden mt-3 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-xs text-rose-700">
    </div>
  </div>

  <div id="cameraModal"
    class="fixed inset-0 bg-black/70 hidden items-end md:items-center justify-center z-50 p-0 md:p-4">
    <div class="bg-white rounded-t-2xl md:rounded-2xl p-4 w-full max-w-sm shadow-2xl">
      <div class="text-sm font-semibold mb-2">Escanea el código QR</div>
      <video id="video" class="w-full rounded-xl bg-slate-100 aspect-video" autoplay playsinline></video>
      <div id="cameraHint" class="mt-2 text-xs text-slate-500">
        Esperando código QR…
      </div>
      <div id="cameraSupportNote" class="mt-2 text-[11px] text-slate-400">
        Si no abre o no detecta el QR, puedes ingresar el código manualmente.
      </div>
      <div class="mt-3 grid grid-cols-1 gap-2 sm:grid-cols-2">
        <button id="btnRetryCamera"
          type="button"
          class="hidden rounded-xl bg-[#4E7287] px-4 py-2 text-sm text-white hover:opacity-95">
          Reintentar cámara
        </button>
        <button id="btnCloseCamera"
          class="w-full rounded-xl border px-4 py-2 text-sm hover:bg-slate-50 sm:col-span-1">
          Cancelar
        </button>
      </div>
    </div>
  </div>

  <div id="residentDirectSection" class="rounded-2xl bg-white shadow p-4 border border-slate-200">
    <div class="flex flex-col lg:flex-row gap-2">
      <input id="residentDirectSearch"
        class="flex-1 rounded-xl border px-3 py-2 text-sm"
        placeholder="Buscar por nombre, unidad, teléfono o email" />

      <button id="btnBuscarResidenteDirecto"
        class="rounded-xl bg-[#4E7287] text-white px-4 py-2 text-sm hover:opacity-95">
        Buscar residente
      </button>
    </div>

    <div id="residentDirectAlert"
      class="hidden mt-3 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-xs text-rose-700">
    </div>

    <div id="residentDirectResults" class="mt-4 space-y-3 text-sm text-slate-600"></div>
    <div class="mt-4 border-t border-slate-100 pt-4">
      <div class="flex justify-end">
      <button id="btnRefrescarHist"
        class="rounded-lg border px-3 py-2 text-sm text-slate-600 hover:bg-slate-50">
        Refrescar
      </button>
      </div>

      <div id="accesosHist" class="mt-4 text-xs text-slate-500">
        Cargando…
      </div>

      <div id="accesosHistPagination" class="mt-4 flex justify-end gap-2"></div>
    </div>
  </div>

  <div id="accessActionModal" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm">
    <div class="flex min-h-full items-end justify-center p-0 sm:items-center sm:p-4">
      <div class="flex max-h-[92vh] w-full flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl sm:max-w-xl sm:rounded-3xl">
        <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
          <div>
            <div class="text-base font-semibold text-slate-800" id="accessActionTitle">Validación de acceso</div>
            <div id="accessActionStatus" class="mt-1 inline-flex rounded-full bg-slate-100 px-3 py-1 text-xs text-slate-700">Esperando validación</div>
          </div>
          <button id="btnCloseAccessActionModal" type="button"
            class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200">✕</button>
        </div>

        <div class="flex-1 overflow-y-auto px-5 py-4">
          <div id="accessActionBody" class="space-y-3 text-sm text-slate-700">
            Ingresa un código para validar el acceso.
          </div>

          <div id="accessActionDynamicForm" class="mt-4 hidden space-y-3 rounded-2xl border border-slate-200 bg-slate-50 p-4">
            <div id="accessPinWrap" class="hidden">
              <label class="mb-1 block text-xs uppercase tracking-wide text-slate-500">PIN de la persona</label>
              <input id="accessPin"
                inputmode="numeric"
                type="password"
                class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"
                placeholder="Ingresa PIN para validar" />
            </div>

            <div id="accessEvidenceWrap" class="hidden">
              <label class="mb-1 block text-xs uppercase tracking-wide text-slate-500">Foto de evidencia</label>
              <input id="accessEvidence"
                type="file"
                accept=".jpg,.jpeg,.png,image/jpeg,image/png"
                class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm bg-white" />
              <p class="mt-1 text-[11px] text-slate-400">Idealmente INE junto con placa o evidencia del material/equipo.</p>
            </div>

            <div>
              <label class="mb-1 block text-xs uppercase tracking-wide text-slate-500">Notas de caseta</label>
              <textarea id="accessNotes"
                rows="3"
                class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"
                placeholder="Observaciones rápidas, novedades o aclaraciones"></textarea>
            </div>
          </div>
        </div>

        <div class="border-t border-slate-100 bg-white px-5 py-4">
          <div class="grid grid-cols-1 gap-2 sm:grid-cols-2">
            <button id="btnConfirmarEntrada"
                    class="rounded-2xl bg-emerald-600 px-4 py-3 text-sm font-medium text-white shadow disabled:cursor-not-allowed disabled:opacity-50 hover:bg-emerald-700">
              Registrar entrada
            </button>

            <button id="btnConfirmarSalida"
                    class="rounded-2xl bg-[#2E5D73] px-4 py-3 text-sm font-medium text-white shadow disabled:cursor-not-allowed disabled:opacity-50 hover:opacity-95">
              Registrar salida
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

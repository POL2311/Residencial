<div class="space-y-5" id="accesosView">

  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
    <div>
      <h2 class="text-3xl font-semibold text-slate-700">Control de accesos</h2>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">

    <!-- Lado Izquierdo: Always-on Scanner / Input Principal -->
    <div class="lg:col-span-7 flex flex-col gap-5">
      <div class="rounded-[2rem] border border-slate-200/40 bg-white/60 backdrop-blur-xl p-5 shadow-sm overflow-hidden flex flex-col gap-4">

        <!-- Contenedor del Video -->
        <div id="scannerContainer" class="relative w-full overflow-hidden rounded-3xl bg-slate-900 aspect-video flex items-center justify-center">
          <video id="video" class="absolute inset-0 w-full h-full object-cover" autoplay playsinline></video>
          <div id="cameraOverlay" class="absolute inset-0 pointer-events-none border-[3px] border-white/20 rounded-3xl m-6"></div>
          <div id="cameraHint" class="absolute bottom-4 left-0 right-0 text-center text-xs font-medium text-white/90 drop-shadow-md z-10">
            Escaneando código QR...
          </div>
          <div id="cameraFallback" class="hidden absolute inset-0 bg-slate-50 flex-col items-center justify-center p-6 text-center z-20">
            <svg class="h-8 w-8 text-slate-400 mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
              <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
            <div class="text-sm font-semibold text-slate-700">Cámara no disponible</div>
            <p class="mt-1 text-xs text-slate-500">Usa la búsqueda manual abajo</p>
            <button id="btnRetryCamera" type="button" class="mt-4 rounded-xl bg-white border border-slate-200 px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-50 transition-colors">
              Reintentar conexión
            </button>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-2 relative z-30">
          <div class="relative flex-1">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <svg class="h-4 w-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <input id="codigo" class="block w-full rounded-2xl border-0 py-3 pl-10 pr-4 text-sm text-slate-900 ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-inset focus:ring-[#2E5D73] bg-white transition-all shadow-sm" placeholder="O ingresar código / nombre..." autocomplete="off">
          </div>
          <button id="btnBuscar" class="shrink-0 rounded-2xl bg-[#2E5D73] px-6 py-3 text-sm font-medium text-white shadow-sm hover:opacity-95 transition-opacity">
            Buscar
          </button>
        </div>

        <div id="accesosAlert" class="hidden rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700"></div>
        <div id="residentDirectResults" class="hidden space-y-3 text-sm text-slate-600"></div>
      </div>
    </div>

    <!-- Lado Derecho: Historial de Accesos (Stripe Style) -->
    <div class="lg:col-span-5">
      <div class="h-full rounded-[2rem] border border-slate-200/40 bg-white/60 backdrop-blur-xl shadow-sm flex flex-col overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-white/40">
          <div class="flex items-center gap-2">
            <svg class="h-4 w-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            <h3 class="text-sm font-bold text-slate-800 tracking-tight">Últimos validados</h3>
          </div>
          <button id="btnRefrescarHist" type="button" class="h-8 w-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 hover:text-slate-800 transition-colors" title="Actualizar">
            <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
          </button>
        </div>
        <div id="accesosHist" class="flex-1 overflow-y-auto p-2 bg-slate-50/30">
          <div class="p-4 text-sm text-slate-500 text-center">Cargando historial...</div>
        </div>
        <div id="accesosHistPagination" class="px-5 py-3 border-t border-slate-100 bg-white/40 flex justify-end gap-2 text-xs"></div>
      </div>
    </div>

  </div>

  <div id="accessActionModal" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm">
    <div class="flex min-h-full items-end justify-center p-0 sm:items-center sm:p-4">
      <div class="flex max-h-[92vh] w-full flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl sm:max-w-xl sm:rounded-3xl">
        <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
          <div>
            <div class="text-base font-semibold text-slate-800" id="accessActionTitle">Validación de acceso</div>
            <div id="accessActionStatus" class="mt-1 inline-flex rounded-full bg-slate-100 px-3 py-1 text-xs text-slate-700">Esperando validación</div>
          </div>
          <button id="btnCloseAccessActionModal" type="button"
            class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200">✕</button>
        </div>

        <div class="flex-1 overflow-y-auto px-5 py-4">
          <div id="accessActionBody" class="space-y-3 text-sm text-slate-700">
            Ingresa un código para validar el acceso.
          </div>

          <div id="accessActionDynamicForm" class="mt-4 hidden space-y-3 rounded-2xl border border-slate-200 bg-slate-50 p-4">
            <div id="accessPinWrap" class="hidden">
              <label class="mb-1 block text-xs uppercase tracking-wide text-slate-500">PIN de la persona</label>
              <input id="accessPin"
                inputmode="numeric"
                type="password"
                class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"
                placeholder="Ingresa PIN para validar" />
            </div>

            <div id="accessEvidenceWrap" class="hidden">
              <label class="mb-1 block text-xs uppercase tracking-wide text-slate-500">Foto de evidencia</label>
              <input id="accessEvidence"
                type="file"
                accept=".jpg,.jpeg,.png,image/jpeg,image/png"
                class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm bg-white" />
              <p class="mt-1 text-[11px] text-slate-400">Idealmente INE junto con placa o evidencia del material/equipo.</p>
            </div>

            <div>
              <label class="mb-1 block text-xs uppercase tracking-wide text-slate-500">Notas de caseta</label>
              <textarea id="accessNotes"
                rows="3"
                class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"
                placeholder="Observaciones rápidas, novedades o aclaraciones"></textarea>
            </div>
          </div>
        </div>

        <div id="accessActionButtons" class="hidden border-t border-slate-100 bg-white px-5 py-4">
          <div class="grid grid-cols-1 gap-2 sm:grid-cols-2">
            <button id="btnConfirmarEntrada"
                    class="rounded-2xl bg-emerald-600 px-4 py-3 text-sm font-medium text-white shadow disabled:cursor-not-allowed disabled:opacity-50 hover:bg-emerald-700">
              Registrar entrada
            </button>

            <button id="btnConfirmarSalida"
                    class="rounded-2xl bg-[#2E5D73] px-4 py-3 text-sm font-medium text-white shadow disabled:cursor-not-allowed disabled:opacity-50 hover:opacity-95">
              Registrar salida
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

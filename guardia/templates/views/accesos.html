<!-- guardia/templates/views/accesos.html -->
<div class="space-y-4" id="accesosView">

  <div class="flex items-end justify-between">
    <h2 class="text-3xl font-semibold text-slate-700">Control de accesos</h2>
    <button class="text-xl text-slate-500" onclick="location.hash='home'">Inicio</button>
  </div>

<!-- BUSCAR / ESCANEAR -->
<div class="rounded-2xl bg-white shadow p-4">
  <div class="text-sm font-semibold text-slate-700">Escanear o ingresar código</div>

  <div class="mt-3 flex gap-2">
    <button id="btnOpenCamera"
      class="rounded-xl bg-slate-800 text-white px-4 py-2 text-sm">
      📷 Escanear QR
    </button>

    <input id="codigo"
      class="flex-1 rounded-xl border px-3 py-2 text-sm"
      placeholder="Ingresar código manual" />

    <button id="btnBuscar"
      class="rounded-xl bg-[#4E7287] text-white px-4 py-2 text-sm">
      Buscar
    </button>
  </div>

  <div id="accesosAlert"
    class="hidden mt-3 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-xs text-rose-700">
  </div>
</div>

<!-- MODAL CAMARA -->
<div id="cameraModal"
  class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">
  <div class="bg-white rounded-2xl p-4 w-full max-w-sm">
    <div class="text-sm font-semibold mb-2">Escanea el código QR</div>
    <video id="video" class="w-full rounded-xl" autoplay></video>
    <button id="btnCloseCamera"
      class="mt-3 w-full rounded-xl border px-4 py-2 text-sm">
      Cancelar
    </button>
  </div>
</div>


  <!-- RESULTADO -->
  <div class="rounded-2xl bg-white shadow p-4">
    <div class="text-sm font-semibold text-slate-700">Resultado</div>

    <div id="accesoResultado" class="mt-3 text-sm text-slate-600">
      Ingresa un código para validar el acceso.
    </div>

    <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-2">
      <button id="btnConfirmarEntrada"
              class="rounded-xl bg-emerald-600 text-white px-4 py-2 text-sm shadow disabled:opacity-50">
        Registrar entrada
      </button>

      <button id="btnConfirmarSalida"
              class="rounded-xl bg-[#2E5D73] text-white px-4 py-2 text-sm shadow disabled:opacity-50">
        Registrar salida
      </button>
    </div>
  </div>

  <!-- HISTORIAL -->
  <div class="rounded-2xl bg-white shadow p-4">
    <div class="flex justify-between">
      <div class="text-sm font-semibold text-slate-700">Historial reciente</div>
      <button id="btnRefrescarHist" class="text-sm text-slate-500">Refrescar</button>
    </div>

    <div id="accesosHist" class="mt-3 text-xs text-slate-500">
      Cargando…
    </div>
  </div>

</div>
